# shell .

#: 要执行的 shell 程序。默认值 `.` 表示使用 `SHELL` 环境变量的值；如果未
#: 设置该变量，则使用当前用户的默认 shell。请注意，在 macOS 上修改此项时，
#: 可能需要添加 `--login` 和 `--interactive`，以确保 shell 以交互模式启动
#: 并读取其启动 rc 文件。此设置会展开环境变量。

# editor .

#: 编辑 kitty 配置文件或执行类似任务时使用的终端文本编辑器，例如 Vim 或
#: Nano。

#: 默认值 `.` 表示依次使用环境变量 `VISUAL` 和 `EDITOR`。如果二者均未设置，
#: kitty 会运行 shell（`$SHELL -l -i -c env`），检查 shell 启动 rc 文件是否
#: 设置了 `VISUAL` 或 `EDITOR`。如果仍未找到，kitty 会依次检查各种已知
#: 编辑器（Vim、Emacs 等），并使用系统中第一个存在的编辑器。

# close_on_child_death no

#: 子进程（通常是 shell）退出时关闭窗口。使用默认值 `no` 时，只要仍有其他
#: 进程向终端输出（例如已脱离 shell 或在后台运行的进程），子进程退出后终端
#: 仍会保持打开。设为 `yes` 后，子进程一退出窗口就会关闭。请注意，这可能
#: 使仍在使用终端的后台进程静默失败，因为其标准输入、标准输出和标准错误
#: 将不再可用。

# remote_control_password

#: 允许其他程序使用密码控制 kitty。此选项可指定多次，以添加多个密码。如果
#: 没有配置密码，而程序尝试使用密码进行远程控制，kitty 会请求用户授权。
#: 还可以选择将密码与一组获准的远程控制操作关联。例如：

#:     remote_control_password "my passphrase" get-colors set-colors focus-window focus-tab

#: 使用此密码时，只允许执行指定操作。也可以使用 glob 模式，例如：

#:     remote_control_password "my passphrase" set-tab-* resize-*

#: 运行以下命令可查看可用操作列表：

#:     kitten @ --help

#: 使用空密码可以指定未发送密码时允许执行的一组操作。例如：

#:     remote_control_password "" *-colors

#: 最后，还可以指定一个 Python 模块的路径。该模块需提供 `is_cmd_allowed`
#: 函数，用于检查每条远程控制命令。例如：

#:     remote_control_password "my passphrase" my_rc_command_checker.py

#: 相对路径以 kitty 配置目录为基准进行解析。详情参见 `rc_custom_auth`：
#: <https://sw.kovidgoyal.net/kitty/remote-control/#rc-custom-auth>。

# allow_remote_control no

#: 允许其他程序控制 kitty。启用后，其他程序可以控制 kitty 的各个方面，包括
#: 向 kitty 窗口发送文本、打开或关闭窗口、读取窗口内容等。请注意，这甚至
#: 可以通过 SSH 连接工作。默认值 `no` 会阻止任何形式的远程控制。各值含义
#: 如下：

#: password
#:     通过 TTY 设备和套接字收到的远程控制请求都根据密码进行确认。参见
#:     `remote_control_password`。

#: socket-only
#:     无条件接受通过套接字收到的远程控制请求，拒绝通过 TTY 收到的请求。
#:     参见 `listen_on`。

#: socket
#:     无条件接受通过套接字收到的远程控制请求；通过 TTY 收到的请求根据
#:     密码进行确认。

#: no
#:     完全禁用远程控制。

#: yes
#:     始终接受远程控制请求。

# listen_on none

#: 在指定套接字上监听远程控制连接。请注意，此设置适用于所有 kitty 实例，
#: 但可以由 `kitty --listen-on` 命令行选项覆盖。UNIX 套接字示例包括
#: `unix:${TEMP}/mykitty` 或 Linux 上的 `unix:@mykitty`。环境变量会被展开，
#: 相对路径以临时目录为基准进行解析。如果值中包含 `{kitty_pid}`，它会替换
#: 为 kitty 进程的 PID；否则会以连字符为分隔，将 PID 追加到值的末尾。对于
#: `tcp:localhost:0` 之类的 TCP 套接字，即使指定了非零端口，也始终使用
#: 随机端口。详情参见 `kitty --listen-on` 的帮助。只有将
#: `allow_remote_control` 设为 `yes`、`socket` 或 `socket-only` 时，此设置
#: 才会生效。不支持通过重新加载配置来更改此选项。

# env

#: 指定要在所有子进程中设置的环境变量。变量名后带等号（例如 `env VAR=`）
#: 会将其设为空字符串；只指定变量名（例如 `env VAR`）则会从子进程环境中
#: 移除该变量。请注意，环境变量会递归展开，例如：

#:     env VAR1=a
#:     env VAR2=${HOME}/${VAR1}/b

#: `VAR2` 的值将为 `<主目录路径>/a/b`。

#: 使用特殊值 `read_from_shell` 可让 kitty 从登录 shell 配置中读取指定变量。
#: 如果 shell 启动文件设置了许多希望在 kitty 及 kitty 会话文件中使用的环境
#: 变量，此功能会很有用。每个变量名都作为 glob 模式进行匹配。例如：
#: `env read_from_shell=PATH LANG LC_* XDG_* EDITOR VISUAL`。请注意，这些
#: 变量只有在配置处理完毕后才会读取，因此不能用于递归展开，并且会覆盖其他
#: `env` 指令设置的同名变量。

# filter_notification

#: 指定规则以过滤 kitty 内运行的应用程序所发送的通知。可以多次指定以创建
#: 多条过滤规则。规则格式为 `field:regexp`，可匹配 `title`、`body`、`app`
#: 或 `type` 字段。特殊值 `all` 会过滤所有通知。规则可使用布尔运算符组合。
#: 示例：

#:     filter_notification title:hello or body:"abc.*def"
#:     # 过滤来自 Vim 的通知，但保留与更新有关的通知；(?i) 表示不区分大小写。
#:     filter_notification app:"[ng]?vim" and not body:"(?i)update"
#:     # 过滤所有通知
#:     filter_notification all

#: `app` 字段是发送通知的应用程序名称，`type` 是通知类型。并非所有应用程序
#: 都会发送这些字段，因此也可以匹配通知文本的标题和正文。在 kitty 配置目录
#: （`~/.config/kitty`）中创建 `notifications.py`，可以实现更复杂的程序化
#: 过滤及通知自定义操作。带注释的示例参见：
#: <https://github.com/kovidgoyal/kitty/blob/master/docs/notifications.py>。

# watcher

#: 为监视器加载的 Python 文件路径：
#: <https://sw.kovidgoyal.net/kitty/launch/#watchers>。可以多次指定以加载多个
#: 监视器，它们会添加到每个 kitty 窗口。相对路径以 kitty 配置目录为基准
#: 进行解析。请注意，重新加载配置只会影响此后创建的窗口。

# exe_search_path

#: 控制 kitty 在何处查找要运行的程序。默认搜索顺序为：首先搜索系统范围的
#: `PATH`，然后搜索 `~/.local/bin` 和 `~/bin`。如果仍未找到，则尝试登录
#: shell 加载所有启动文件后定义的 `PATH`。最后，如果存在，再尝试由 `env`
#: 选项指定的 `PATH`。

#: 此选项允许在搜索顺序中前置、追加或移除路径，并可多次指定。普通路径会被
#: 前置；以 `+` 开头的路径会追加到上述 `~/bin` 之后；以 `-` 开头的路径会
#: 从整个搜索顺序中移除。例如：

#:     exe_search_path /some/prepended/path
#:     exe_search_path +/some/appended/path
#:     exe_search_path -/some/excluded/path

# update_check_interval 24

#: 定期检查 kitty 更新的间隔（单位为小时）。发现更新时会显示系统通知。默认
#: 每 24 小时检查一次，设为零可禁用。只有官方二进制构建会检查更新，发行版
#: 软件包和源码构建不会执行更新检查。不支持通过重新加载配置来更改此选项。

# auto_reload_config 0.1

#: 配置文件发生变化时自动重新加载。此值表示重新加载前等待的秒数，用于对
#: 连续多次更改进行防抖。使用负值可禁用自动重新加载，也可以通过
#: `reload_config_file` 手动加载。请注意，只有 kitty 启动时 `kitty.conf`
#: 已经存在，自动重新加载才会工作。通过重新加载配置对此设置所做的更改会
#: 被忽略。

# startup_session none

#: 所有 kitty 实例使用的会话文件路径。可以对单个实例使用
#: `kitty --session=none` 命令行选项覆盖此设置。详情参见 kitty 文档中的会话：
#: <https://sw.kovidgoyal.net/kitty/sessions/>。相对路径以 kitty 配置目录为
#: 基准进行解析，路径中的环境变量会被展开。不支持通过重新加载配置来更改
#: 此选项。如果启动 kitty 时通过命令行参数指定了要运行的命令，此选项会被
#: 忽略。

# clipboard_control write-clipboard write-primary read-clipboard-ask read-primary-ask

#: 允许 kitty 中运行的程序读写剪贴板。可以精确控制允许的操作：
#: `write-clipboard`、`read-clipboard`、`write-primary`、`read-primary`、
#: `read-clipboard-ask` 和 `read-primary-ask`。默认允许写入剪贴板和主选择区，
#: 并在程序尝试读取时请求授权。请注意，禁用读取确认存在安全风险，因为任何
#: 程序，甚至通过 SSH 在远程服务器上运行的程序，都将能够读取你的剪贴板。
#: 另请参阅 `clipboard_max_size`。

# clipboard_max_size 512

#: kitty 中运行的程序准备写入系统剪贴板时，kitty 所存储数据的最大大小
#: （单位为 MB）。设为零表示不限制大小。另请参阅 `clipboard_control`。

# file_transfer_confirmation_bypass

#: 可提供给文件传输 kitten 的密码，用于跳过传输确认提示：
#: <https://sw.kovidgoyal.net/kitty/kittens/transfer/>。只有从可信计算机发起传输，
#: 并使用可信网络或加密传输通道时才应使用此功能，因为它允许远程计算机上
#: 运行的任何程序无需授权即可读写本地文件系统。

# allow_hyperlinks yes

#: 处理超链接转义序列（`OSC 8`）。禁用后会忽略 `OSC 8` 转义序列；否则它们
#: 会变成可点击的链接，可以使用鼠标或 hints kitten 打开：
#: <https://sw.kovidgoyal.net/kitty/kittens/hints/>。特殊值 `ask` 表示点击链接
#: 时，kitty 会在打开前请求确认。

# shell_integration enabled

#: 在受支持的 shell 中启用 shell 集成，从而支持跳转到先前的提示符、在分页器
#: 中浏览上一条命令的输出等功能。设为 `disabled` 可完全关闭 shell 集成。
#: 也可以单独禁用某些功能，方法是设置由空格分隔的以下值：`no-rc`、
#: `no-cursor`、`no-title`、`no-cwd`、`no-prompt-mark`、`no-complete`、
#: `no-sudo`。详情参见 shell 集成：
#: <https://sw.kovidgoyal.net/kitty/shell-integration/>。

# allow_cloning ask

#: 控制终端中运行的程序能否请求创建新窗口。典型示例是 `clone-in-kitty`：
#: <https://sw.kovidgoyal.net/kitty/shell-integration/#clone-shell>。
#: 默认情况下，kitty 会对每次克隆请求进行授权确认。无条件允许克隆，会使
#: 终端中运行的程序（包括通过 SSH 运行的程序）获得权限，以终端所属用户的
#: 身份，在终端所在计算机上执行任意代码。

# clone_source_strategies venv,conda,env_var,path

#: 控制在新克隆的窗口中运行 `clone-in-kitty` 时要加载哪些 shell 代码。
#: 支持的策略如下：

#: venv
#:     加载 `$VIRTUAL_ENV/bin/activate` 文件。这由 Python 标准库的 `venv`
#:     模块使用，可自动克隆虚拟环境。
#: conda
#:     运行 `conda activate $CONDA_DEFAULT_ENV`，支持由 Conda 创建的虚拟环境。
#: env_var
#:     使用 `eval` 执行环境变量 `KITTY_CLONE_SOURCE_CODE` 的内容。
#: path
#:     加载环境变量 `KITTY_CLONE_SOURCE_PATH` 所指向的文件。

#: 此选项必须是由逗号分隔的上述值列表。按照指定顺序，只加载第一个有效匹配。

# notify_on_cmd_finish never

#: 长时间运行的命令结束时显示桌面通知（需要 `shell_integration`）。可用值为：

#: never
#:     从不发送通知。

#: unfocused
#:     仅当窗口没有键盘焦点时发送通知。

#: invisible
#:     仅当窗口既未获得焦点、对用户也不可见时发送通知。例如，窗口位于非活动
#:     标签页中，或者其 OS 窗口当前不可见。在支持查询 OS 窗口可见性的平台上，
#:     只有活动的 OS 窗口才视为可见。

#: always
#:     无论窗口状态如何，始终发送通知。

#: 还可以指定两个可选参数：

#: 第一个可选参数是将命令视为长时间运行所需的最短持续时间，默认为 5 秒。
#: 将持续时间指定为第二个参数，例如 `invisible 15`。不要将此值设得过小，
#: 否则启动新 OS 窗口后随即退出的命令会产生大量通知。

#: 第二个可选参数是要执行的操作，默认为 `notify`。可用值为：

#: notify
#:     发送桌面通知。后续参数可选，用于指定何时自动清除通知。可触发清除的
#:     事件为 `focus` 和 `next`。`focus` 表示通知策略为 `unfocused` 或
#:     `invisible` 时，窗口重新获得焦点便自动清除通知；`next` 表示显示下一条
#:     通知时清除上一条通知。未指定参数时默认为 `focus next`。

#: bell
#:     触发终端响铃。

#: notify-bell
#:     发送桌面通知并触发终端响铃。参数与 `notify` 相同。

#: command
#:     运行自定义命令。后续所有参数都组成要运行的命令行。

#: 更多示例：

#:     # 非聚焦窗口中的命令运行超过 5 秒时发送通知
#:     notify_on_cmd_finish unfocused
#:     # 不可见窗口中的命令运行超过 10 秒时发送通知
#:     notify_on_cmd_finish invisible 10.0
#:     # 不可见窗口中的命令运行超过 10 秒时触发响铃
#:     notify_on_cmd_finish invisible 10.0 bell
#:     # 不可见窗口中的命令运行超过 10 秒时运行 notify-send
#:     # %c 会替换为当前命令行，%s 会替换为作业退出码
#:     notify_on_cmd_finish invisible 10.0 command notify-send "job finished with status: %s" %c
#:     # 下一条命令结束或窗口重新获得焦点时，不清除上一条通知
#:     notify_on_cmd_finish invisible 5.0 notify

# term xterm-kitty

#: 要设置的 `TERM` 环境变量值。更改它可能会破坏许多终端程序；只有确切知道
#: 自己在做什么时才应修改，不要仅仅因为在 Stack Overflow 上看到某条建议
#: 就更改它。各种程序使用 `TERM` 获取终端能力和行为信息。修改后，视所运行
#: 程序以及目标终端类型的差异程度而定，从按键、颜色到各种高级功能都可能
#: 无法正常工作。重新加载配置来更改此选项，只会影响新创建的窗口。

# terminfo_type path

#: 要设置的 `TERMINFO` 环境变量值。终端中运行的程序使用该变量查找 terminfo
#: 数据库。默认值 `path` 会让 kitty 将其设为包含 kitty terminfo 数据库的
#: 文件系统位置。值 `direct` 表示直接将整个数据库放入环境变量，例如连接到
#: 容器时可能很有用；但请注意，并非所有软件都支持此方式。值 `none` 表示
#: 不修改该变量。

# forward_stdio no

#: 将 kitty 进程的标准输出（STDOUT）和标准错误（STDERR）转发给子进程。这对
#: 调试很有用，因为子进程可以直接输出到 kitty 的 STDOUT。例如，在 shell
#: 中运行 `echo hello world >&$KITTY_STDIO_FORWARDED` 会输出到父 kitty 进程
#: 的 STDOUT。此项会设置环境变量 `KITTY_STDIO_FORWARDED=fdnum`，让子进程
#: 得知该转发。请注意，在 macOS 上，这会阻止通过 `login` 实用程序运行
#: shell，因此本会话内运行的程序无法使用 `getlogin()`。

# menu_map

#: 为 kitty 的各种菜单指定条目。目前只支持 macOS 的全局菜单栏。例如：

#:    menu_map global "Actions::Launch something special" launch --hold --type=os-window sh -c "echo hello world"

#: 这会在 macOS 全局菜单栏的 `Actions` 菜单中创建名为
#: `Launch something special` 的菜单项。添加更多由 `::` 分隔的层级可以创建
#: 子菜单。

#: }}}

#: 操作系统专属调整 {{{

# wayland_titlebar_color system

#: 在 GNOME 等使用客户端窗口装饰的 Wayland 系统上，kitty 窗口标题栏的颜色。
#: 值 `system` 表示使用系统默认颜色，`background` 表示使用当前活动 kitty
#: 窗口的背景色；也可以使用任意颜色，例如 `#12af59` 或 `red`。

# macos_titlebar_color system

#: macOS 上 kitty 窗口标题栏的颜色。值 `system` 表示使用系统默认颜色，也可
#: 使用 `light` 或 `dark` 明确指定浅色或深色。值 `background` 表示使用
#: 当前活动窗口的背景色；还可以使用任意颜色，例如 `#12af59` 或 `red`。

#: 请注意，使用 `auto_color_scheme` 时：
#: <https://sw.kovidgoyal.net/kitty/kittens/themes/#auto-color-scheme>
#: 此选项会被配色方案文件覆盖，必须在该文件中设置才能生效。

# macos_option_as_alt no

#: 在 macOS 上将 Option 键用作 Alt 键。设为 `no` 时，kitty 会保留 macOS
#: 原生的 Option+按键 Unicode 字符输入行为。这会使终端程序中的所有 Alt+按键
#: 快捷键失效，但仍可使用 macOS 的 Unicode 输入方式。也可以使用 `left`、
#: `right` 或 `both`，分别只将左 Option、右 Option 或两个 Option 键用作 Alt。
#: 请注意，kitty 自身始终将 Option 与 Alt 视为相同的键，因此不能通过此选项
#: 为 Option+按键和 Alt+按键配置不同的 kitty 快捷键。此外，使用
#: Option/Alt+按键的 kitty 快捷键具有优先权，这类按键不会传递给 kitty 中
#: 运行的终端程序。不支持通过重新加载配置来更改此选项。

# macos_hide_from_tasks no

#: 在 macOS 的运行中任务列表（⌘+Tab 和程序坞）中隐藏 kitty 窗口。不支持
#: 通过重新加载配置来更改此选项。

# macos_quit_when_last_window_closed no

#: 在 macOS 上关闭所有顶层窗口后退出 kitty。默认情况下，即使没有打开的
#: 窗口，kitty 也会继续运行，这符合 macOS 的常规行为。

# macos_window_resizable yes

#: 如果不希望在 macOS 上调整 kitty 顶层 OS 窗口的大小，请禁用此项。

# macos_thicken_font 0

#: 使用指定宽度为字体增加额外描边，以提高 macOS 上小字号文本的可读性。例如，
#: 值 0.75 在常见字号下会产生近似次像素抗锯齿的渲染效果。请注意，此选项
#: 在现代 kitty 中已经过时，但仍受支持。建议改用
#: `text_composition_strategy`。

# macos_traditional_fullscreen no

#: 使用 macOS 的传统全屏过渡效果；速度更快，但视觉效果稍逊。

# macos_fullscreen_ignore_safe_area_insets no

#: 使用 `macos_traditional_fullscreen` 时，忽略刘海屏 MacBook 等显示器的
#: 安全区域内缩。这样 kitty 可以使用完整的显示区域，不再为刘海区域预留空间。

# macos_show_window_title_in all

#: 控制 macOS 上窗口标题的显示位置。值 `window` 会在 macOS 窗口顶部显示
#: 当前活动窗口的标题；`menubar` 会将标题显示在 macOS 全局菜单栏中，利用
#: 原本闲置的空间；`all` 会在两个位置都显示标题；`none` 则隐藏标题。有关
#: 如何控制菜单栏中的标题长度，请参阅 `macos_menubar_title_max_length`。

# macos_menubar_title_max_length 0

#: macOS 全局菜单栏中最多显示的窗口标题字符数。小于 1 的值表示不设上限。

# macos_custom_beam_cursor no

#: 在 macOS 上使用自定义的 I 形鼠标指针，使其在浅色和深色背景上都更容易
#: 看清。如今 macOS 的默认指针已经带有白色边框。警告：此设置可能导致鼠标
#: 指针在双 GPU 计算机上不可见。不支持通过重新加载配置来更改此选项。

# macos_colorspace srgb

#: 解释终端颜色时使用的色彩空间。默认值 `srgb` 会使颜色与网页浏览器中的
#: 显示效果一致。值 `default` 使用显示器的原生色彩空间。值 `displayp3`
#: 使用 Apple 特有的 Display P3 色彩空间，会产生饱和度过高（更明亮）且
#: 略有偏色的效果。重新加载配置来更改此值，只会影响新创建的 OS 窗口。

linux_display_server wayland

#: 在 Wayland 和 X11 后端之间选择。默认根据系统状态自动选择合适的后端。
#: 设为 `x11` 或 `wayland` 可以强制使用相应后端。不支持通过重新加载配置
#: 来更改此选项。

wayland_enable_ime yes

#: 在 Wayland 上启用输入法扩展，通常用于输入东亚语言文本。然而，Wayland
#: 中的相关实现经常存在问题，并会在输入循环中引入延迟；如果确定不需要，
#: 可以将其禁用。不支持通过重新加载配置来更改此选项，这样做不会产生效果。

#: }}}

#: Keyboard shortcuts {{{

#: Keys are identified simply by their lowercase Unicode characters.
#: For example: a for the A key, [ for the left square bracket key,
#: etc. For functional keys, such as Enter or Escape, the names are
#: present at Functional key definitions
#: <https://sw.kovidgoyal.net/kitty/keyboard-protocol/#functional>.
#: For modifier keys, the names are ctrl (control, ⌃), shift (⇧), alt
#: (opt, option, ⌥), super (cmd, command, ⌘).

#: Simple shortcut mapping is done with the map directive. For full
#: details on advanced mapping including modal and per application
#: maps, see mapping <https://sw.kovidgoyal.net/kitty/mapping/>. Some
#: quick examples to illustrate common tasks::

#:     # unmap a keyboard shortcut, passing it to the program running in kitty
#:     map kitty_mod+space
#:     # completely ignore a keyboard event
#:     map ctrl+alt+f1 discard_event
#:     # combine multiple actions
#:     map kitty_mod+e combine : new_window : next_layout
#:     # multi-key shortcuts
#:     map ctrl+x>ctrl+y>z action

#: For non-Latin keyboard layouts (Russian, Arabic, etc.), the
#: --allow-fallback option controls physical key fallback. Values:
#: shifted (default — shifted key fallback), ascii (alternate key /
#: physical position fallback, only for non-ASCII keys), none (disable
#: all fallback), or a comma-separated combination. All default
#: shortcuts use --allow-fallback=shifted,ascii::

#:     map --allow-fallback=shifted,ascii kitty_mod+c copy_to_clipboard

#: You can browse and trigger these actions by pressing
#: command_palette to run the command palette. The full list of
#: actions that can be mapped to key presses is available here
#: <https://sw.kovidgoyal.net/kitty/actions/>.

# kitty_mod ctrl+shift

#: Special modifier key alias for default shortcuts. You can change
#: the value of this option to alter all default shortcuts that use
#: kitty_mod.

# clear_all_shortcuts no

#: Remove all shortcut definitions up to this point. Useful, for
#: instance, to remove the default shortcuts.

# map_timeout 0.0

#: The default timeout (in seconds) for multi-key mappings and modal
#: keyboard modes. If you press the first key(s) of a multi-key
#: mapping and don't press the next key within this timeout, the
#: mapping is cancelled and the mode is exited. A value of zero
#: disables the timeout. This can be overridden for specific modes
#: using the --timeout option when creating a keyboard mode with
#: --new-mode. For example::

#:     # 2 second timeout for all mappings
#:     map_timeout 2.0

#:     # This mode will have a 5 second timeout (overrides the global 2 second timeout)
#:     map --new-mode resize --timeout 5.0 kitty_mod+r

# action_alias

#: E.g. action_alias launch_tab launch --type=tab --cwd=current

#: Define action aliases to avoid repeating the same options in
#: multiple mappings. Aliases can be defined for any action and will
#: be expanded recursively. For example, the above alias allows you to
#: create mappings to launch a new tab in the current working
#: directory without duplication::

#:     map f1 launch_tab vim
#:     map f2 launch_tab emacs

#: Similarly, to alias kitten invocation::

#:     action_alias hints kitten hints --hints-offset=0

# kitten_alias

#: E.g. kitten_alias hints hints --hints-offset=0

#: Like action_alias above, but specifically for kittens. Generally,
#: prefer to use action_alias. This option is a legacy version,
#: present for backwards compatibility. It causes all invocations of
#: the aliased kitten to be substituted. So the example above will
#: cause all invocations of the hints kitten to have the --hints-
#: offset=0 option applied.

#: Clipboard {{{

#: Copy to clipboard

# map --allow-fallback=shifted,ascii kitty_mod+c copy_to_clipboard

#::  There is also a copy_or_interrupt action that can be optionally
#::  mapped to Ctrl+C. It will copy only if there is a selection and
#::  send an interrupt otherwise. Similarly,
#::  copy_and_clear_or_interrupt will copy and clear the selection or
#::  send an interrupt if there is no selection. The copy_or_noop
#::  action will copy if there is a selection and pass the key through
#::  to the application running in the terminal if there is no
#::  selection.

#: Copy to clipboard or pass through

# map --allow-fallback=shifted,ascii cmd+c copy_or_noop

#: Paste from clipboard

# map --allow-fallback=shifted,ascii kitty_mod+v paste_from_clipboard
# map --allow-fallback=shifted,ascii cmd+v paste_from_clipboard

#: Paste from selection

# map --allow-fallback=shifted,ascii kitty_mod+s paste_from_selection
# map shift+insert                   paste_from_selection

#: Pass selection to program

# map --allow-fallback=shifted,ascii kitty_mod+o pass_selection_to_program

#::  You can also pass the contents of the current selection to any
#::  program with pass_selection_to_program. By default, the system's
#::  open program is used, but you can specify your own, the selection
#::  will be passed as a command line argument to the program. For
#::  example::

#::      map kitty_mod+o pass_selection_to_program firefox

#::  You can pass the current selection to a terminal program running
#::  in a new kitty window, by using the @selection placeholder::

#::      map kitty_mod+y new_window less @selection

#: }}}

#: Scrolling {{{

#: Scroll line up

# map kitty_mod+up                   scroll_line_up smooth
# map --allow-fallback=shifted,ascii kitty_mod+k scroll_line_up smooth
# map opt+cmd+page_up                scroll_line_up smooth
# map cmd+up                         scroll_line_up smooth

#: Scroll line down

# map kitty_mod+down                 scroll_line_down smooth
# map --allow-fallback=shifted,ascii kitty_mod+j scroll_line_down smooth
# map opt+cmd+page_down              scroll_line_down smooth
# map cmd+down                       scroll_line_down smooth

#: Scroll page up

# map kitty_mod+page_up scroll_page_up
# map cmd+page_up       scroll_page_up

#: Scroll page down

# map kitty_mod+page_down scroll_page_down
# map cmd+page_down       scroll_page_down

#: Scroll to top

# map kitty_mod+home scroll_home
# map cmd+home       scroll_home

#: Scroll to bottom

# map kitty_mod+end scroll_end
# map cmd+end       scroll_end

#: Scroll to previous shell prompt

# map --allow-fallback=shifted,ascii kitty_mod+z scroll_to_prompt -1

#::  Use a parameter of 0 for scroll_to_prompt to scroll to the last
#::  jumped to or the last clicked position. Requires shell
#::  integration <https://sw.kovidgoyal.net/kitty/shell-integration/>
#::  to work.

#: Scroll to next shell prompt

# map --allow-fallback=shifted,ascii kitty_mod+x scroll_to_prompt 1

#: Browse scrollback buffer in pager

# map --allow-fallback=shifted,ascii kitty_mod+h show_scrollback

#::  You can pipe the contents of the current screen and history
#::  buffer as STDIN to an arbitrary program using launch --stdin-
#::  source. For example, the following opens the scrollback buffer in
#::  less in an overlay window::

#::      map f1 launch --stdin-source=@screen_scrollback --stdin-add-formatting --type=overlay less +G -R

#::  For more details on piping screen and buffer contents to external
#::  programs, see launch <https://sw.kovidgoyal.net/kitty/launch/>.

#: Browse output of the last shell command in pager

# map --allow-fallback=shifted,ascii kitty_mod+g show_last_command_output

#::  You can also define additional shortcuts to get the command
#::  output. For example, to get the first command output on screen::

#::      map f1 show_first_command_output_on_screen

#::  To get the command output that was last accessed by a keyboard
#::  action or mouse action::

#::      map f1 show_last_visited_command_output

#::  You can pipe the output of the last command run in the shell
#::  using the launch action. For example, the following opens the
#::  output in less in an overlay window::

#::      map f1 launch --stdin-source=@last_cmd_output --stdin-add-formatting --type=overlay less +G -R

#::  To get the output of the first command on the screen, use
#::  @first_cmd_output_on_screen. To get the output of the last jumped
#::  to command, use @last_visited_cmd_output.

#::  Requires shell integration
#::  <https://sw.kovidgoyal.net/kitty/shell-integration/> to work.

#: Search the scrollback within a pager

# map kitty_mod+/                    search_scrollback
# map --allow-fallback=shifted,ascii cmd+f search_scrollback

#::  Search for currently selected text in the scrollback using the
#::  configured scrollback_pager. Assumes that pressing the / key
#::  triggers search mode in the pager. If you want to create a manual
#::  mapping with a special pager for this, you can use something
#::  like:

#::      map f1 combine : launch --stdin-source=@screen_scrollback --stdin-add-formatting --type=overlay mypager : send_key /

#::  For more sophisticated control, such as using the current
#::  selection, use remote_control_script.

#: }}}

#: Window management {{{

#: New window

# map kitty_mod+enter new_window
# map cmd+enter       new_window

#::  You can open a new kitty window running an arbitrary program, for
#::  example::

#::      map kitty_mod+y launch mutt

#::  You can open a new window with the current working directory set
#::  to the working directory of the current window using::

#::      map ctrl+alt+enter launch --cwd=current

#::  You can open a new window that is allowed to control kitty via
#::  the kitty remote control facility with launch --allow-remote-
#::  control. Any programs running in that window will be allowed to
#::  control kitty. For example::

#::      map ctrl+enter launch --allow-remote-control some_program

#::  You can open a new window next to the currently active window or
#::  as the first window, with::

#::      map ctrl+n launch --location=neighbor
#::      map ctrl+f launch --location=first

#::  For more details, see launch
#::  <https://sw.kovidgoyal.net/kitty/launch/>.

#: New OS window

# map --allow-fallback=shifted,ascii kitty_mod+n new_os_window
# map --allow-fallback=shifted,ascii cmd+n new_os_window

#::  Works like new_window above, except that it opens a top-level OS
#::  window. In particular you can use new_os_window_with_cwd to open
#::  a window with the current working directory.

#: Close window

# map --allow-fallback=shifted,ascii kitty_mod+w close_window
# map --allow-fallback=shifted,ascii shift+cmd+d close_window

#: Next window

# map kitty_mod+] next_window

#: Previous window

# map kitty_mod+[ previous_window

#: Move window forward

# map --allow-fallback=shifted,ascii kitty_mod+f move_window_forward

#: Move window backward

# map --allow-fallback=shifted,ascii kitty_mod+b move_window_backward

#: Move window to top

# map kitty_mod+` move_window_to_top

#: Start resizing window

# map --allow-fallback=shifted,ascii kitty_mod+r start_resizing_window
# map --allow-fallback=shifted,ascii cmd+r start_resizing_window

#: First window

# map kitty_mod+1 first_window
# map cmd+1       first_window

#: Second window

# map kitty_mod+2 second_window
# map cmd+2       second_window

#: Third window

# map kitty_mod+3 third_window
# map cmd+3       third_window

#: Fourth window

# map kitty_mod+4 fourth_window
# map cmd+4       fourth_window

#: Fifth window

# map kitty_mod+5 fifth_window
# map cmd+5       fifth_window

#: Sixth window

# map kitty_mod+6 sixth_window
# map cmd+6       sixth_window

#: Seventh window

# map kitty_mod+7 seventh_window
# map cmd+7       seventh_window

#: Eighth window

# map kitty_mod+8 eighth_window
# map cmd+8       eighth_window

#: Ninth window

# map kitty_mod+9 ninth_window
# map cmd+9       ninth_window

#: Tenth window

# map kitty_mod+0 tenth_window

#: Visually select and focus window

# map kitty_mod+f7 focus_visible_window

#::  Display overlay numbers and alphabets on the window, and switch
#::  the focus to the window when you press the key. When there are
#::  only two windows, the focus will be switched directly without
#::  displaying the overlay. You can change the overlay characters and
#::  their order with option visual_window_select_characters.

#: Visually swap window with another

# map kitty_mod+f8 swap_with_window

#::  Works like focus_visible_window above, but swaps the window.

#: }}}

#: Tab management {{{

#: Next tab

# map kitty_mod+right next_tab
# map shift+cmd+]     next_tab
# map ctrl+tab        next_tab

#: Previous tab

# map kitty_mod+left previous_tab
# map shift+cmd+[    previous_tab
# map ctrl+shift+tab previous_tab

#: New tab

# map --allow-fallback=shifted,ascii kitty_mod+t new_tab
# map --allow-fallback=shifted,ascii cmd+t new_tab

#: Close tab

# map --allow-fallback=shifted,ascii kitty_mod+q close_tab
# map --allow-fallback=shifted,ascii cmd+w close_tab

#: Close OS window

# map --allow-fallback=shifted,ascii shift+cmd+w close_os_window

#: Move tab forward

# map kitty_mod+. move_tab_forward

#: Move tab backward

# map kitty_mod+, move_tab_backward

#: Set tab title

# map --allow-fallback=shifted,ascii kitty_mod+alt+t set_tab_title
# map --allow-fallback=shifted,ascii shift+cmd+i set_tab_title


#: You can also create shortcuts to go to specific tabs, with 1 being
#: the first tab, 2 the second tab and -1 being the previously active
#: tab, -2 being the tab active before the previously active tab and
#: so on. Any number larger than the number of tabs goes to the last
#: tab and any number less than the number of previously used tabs in
#: the history goes to the oldest previously used tab in the history::

#:     map ctrl+alt+1 goto_tab 1
#:     map ctrl+alt+2 goto_tab 2

#: Just as with new_window above, you can also pass the name of
#: arbitrary commands to run when using new_tab and new_tab_with_cwd.
#: Finally, if you want the new tab to open next to the current tab
#: rather than at the end of the tabs list, use::

#:     map ctrl+t new_tab !neighbor [optional cmd to run]
#: }}}

#: Layout management {{{

#: Next layout

# map --allow-fallback=shifted,ascii kitty_mod+l next_layout


#: You can also create shortcuts to switch to specific layouts::

#:     map ctrl+alt+t goto_layout tall
#:     map ctrl+alt+s goto_layout stack

#: Similarly, to switch back to the previous layout::

#:     map ctrl+alt+p last_used_layout

#: There is also a toggle_layout action that switches to the named
#: layout or back to the previous layout if in the named layout.
#: Useful to temporarily "zoom" the active window by switching to the
#: stack layout::

#:     map ctrl+alt+z toggle_layout stack
#: }}}

#: Font sizes {{{

#: You can change the font size for all top-level kitty OS windows at
#: a time or only the current one.

#: Increase font size

# map kitty_mod+equal  change_font_size all +2.0
# map kitty_mod+plus   change_font_size all +2.0
# map kitty_mod+kp_add change_font_size all +2.0
# map cmd+plus         change_font_size all +2.0
# map cmd+equal        change_font_size all +2.0
# map shift+cmd+equal  change_font_size all +2.0

#: Decrease font size

# map kitty_mod+minus       change_font_size all -2.0
# map kitty_mod+kp_subtract change_font_size all -2.0
# map cmd+minus             change_font_size all -2.0
# map shift+cmd+minus       change_font_size all -2.0

#: Reset font size

# map kitty_mod+backspace change_font_size all 0
# map cmd+0               change_font_size all 0


#: To setup shortcuts for specific font sizes::

#:     map kitty_mod+f6 change_font_size all 10.0

#: To setup shortcuts to change only the current OS window's font
#: size::

#:     map kitty_mod+f6 change_font_size current 10.0

#: To setup shortcuts to multiply/divide the font size::

#:     map kitty_mod+f6 change_font_size all *2.0
#:     map kitty_mod+f6 change_font_size all /2.0
#: }}}

#: Select and act on visible text {{{

#: Use the hints kitten to select text and either pass it to an
#: external program or insert it into the terminal or copy it to the
#: clipboard.

#: Open URL

# map --allow-fallback=shifted,ascii kitty_mod+e open_url_with_hints

#::  Open a currently visible URL using the keyboard. The program used
#::  to open the URL is specified in open_url_with.

#: Insert selected path

# map --allow-fallback=shifted,ascii kitty_mod+p>f kitten hints --type path --program -

#::  Select a path/filename and insert it into the terminal. Useful,
#::  for instance to run git commands on a filename output from a
#::  previous git command.

#: Open selected path

# map --allow-fallback=shifted,ascii kitty_mod+p>shift+f kitten hints --type path

#::  Select a path/filename and open it with the default open program.

#: Insert chosen file

# map --allow-fallback=shifted,ascii kitty_mod+p>c kitten choose-files

#::  Select a file using the choose-files
#::  <https://sw.kovidgoyal.net/kitty/kittens/choose-files/> kitten
#::  and insert it into the terminal.

#: Insert chosen directory

# map --allow-fallback=shifted,ascii kitty_mod+p>d kitten choose-files --mode=dir

#::  Select a directory using the choose-files
#::  <https://sw.kovidgoyal.net/kitty/kittens/choose-files/> kitten
#::  and insert it into the terminal.

#: Insert selected line

# map --allow-fallback=shifted,ascii kitty_mod+p>l kitten hints --type line --program -

#::  Select a line of text and insert it into the terminal. Useful for
#::  the output of things like: `ls -1`.

#: Insert selected word

# map --allow-fallback=shifted,ascii kitty_mod+p>w kitten hints --type word --program -

#::  Select words and insert into terminal.

#: Insert selected hash

# map --allow-fallback=shifted,ascii kitty_mod+p>h kitten hints --type hash --program -

#::  Select something that looks like a hash and insert it into the
#::  terminal. Useful with git, which uses SHA1 hashes to identify
#::  commits.

#: Open the selected file at the selected line

# map --allow-fallback=shifted,ascii kitty_mod+p>n kitten hints --type linenum

#::  Select something that looks like filename:linenum and open it in
#::  your default editor at the specified line number.

#: Open the selected hyperlink

# map --allow-fallback=shifted,ascii kitty_mod+p>y kitten hints --type hyperlink

#::  Select a hyperlink (i.e. a URL that has been marked as such by
#::  the terminal program, for example, by `ls --hyperlink=auto`).


#: The hints kitten has many more modes of operation that you can map
#: to different shortcuts. For a full description see hints kitten
#: <https://sw.kovidgoyal.net/kitty/kittens/hints/>.
#: }}}

#: Miscellaneous {{{

#: Show documentation

# map kitty_mod+f1 show_kitty_doc overview

#: Command palette

# map kitty_mod+f3 command_palette

#: Toggle fullscreen

# map kitty_mod+f11                  toggle_fullscreen
# map --allow-fallback=shifted,ascii ctrl+cmd+f toggle_fullscreen

#: Toggle maximized

# map kitty_mod+f10 toggle_maximized

#: Toggle macOS secure keyboard entry

# map --allow-fallback=shifted,ascii opt+cmd+s toggle_macos_secure_keyboard_entry

#: macOS Cycle through OS Windows

# map cmd+` macos_cycle_through_os_windows

#: macOS Cycle through OS Windows backwards

# map cmd+shift+` macos_cycle_through_os_windows_backwards

#: Unicode input

# map --allow-fallback=shifted,ascii kitty_mod+u kitten unicode_input
# map ctrl+cmd+space                 kitten unicode_input

#: Edit config file

# map kitty_mod+f2 edit_config_file
# map cmd+,        edit_config_file

#: Open the kitty command shell

# map kitty_mod+escape kitty_shell window

#::  Open the kitty shell in a new window / tab / overlay / os_window
#::  to control kitty using commands.

#: Increase background opacity

# map --allow-fallback=shifted,ascii kitty_mod+a>m set_background_opacity +0.1

#: Decrease background opacity

# map --allow-fallback=shifted,ascii kitty_mod+a>l set_background_opacity -0.1

#: Make background fully opaque

# map --allow-fallback=shifted,ascii kitty_mod+a>1 set_background_opacity 1

#: Reset background opacity

# map --allow-fallback=shifted,ascii kitty_mod+a>d set_background_opacity default

#: Reset the terminal

# map kitty_mod+delete clear_terminal reset active
# map opt+cmd+r        clear_terminal reset active

#::  You can create shortcuts to clear/reset the terminal. For
#::  example::

#::      # Reset the terminal
#::      map f1 clear_terminal reset active
#::      # Clear the terminal screen by erasing all contents
#::      map f1 clear_terminal clear active
#::      # Clear the terminal scrollback by erasing it
#::      map f1 clear_terminal scrollback active
#::      # Scroll the contents of the screen into the scrollback
#::      map f1 clear_terminal scroll active
#::      # Clear everything on screen up to the line with the cursor or the start of the current prompt (needs shell integration)
#::      map f1 clear_terminal to_cursor active
#::      # Same as above except cleared lines are moved into scrollback
#::      map f1 clear_terminal to_cursor_scroll active
#::      # Erase the last command and its output (needs shell integration to work)
#::      map f1 clear_terminal last_command active

#::  If you want to operate on all kitty windows instead of just the
#::  current one, use all instead of active.

#::  Some useful functions that can be defined in the shell rc files
#::  to perform various kinds of clearing of the current window:

#::  .. code-block:: sh

#::      clear-only-screen() {
#::          printf "\e[H\e[2J"
#::      }

#::      clear-screen-and-scrollback() {
#::          printf "\e[H\e[3J"
#::      }

#::      clear-screen-saving-contents-in-scrollback() {
#::          printf "\e[H\e[22J"
#::      }

#::  For instance, using these escape codes, it is possible to remap
#::  Ctrl+L to both scroll the current screen contents into the
#::  scrollback buffer and clear the screen, instead of just clearing
#::  the screen. For ZSH, in ~/.zshrc, add:

#::  .. code-block:: zsh

#::      ctrl_l() {
#::          builtin print -rn -- $'\r\e[0J\e[H\e[22J' >"$TTY"
#::          builtin zle .reset-prompt
#::          builtin zle -R
#::      }
#::      zle -N ctrl_l
#::      bindkey '^l' ctrl_l

#::  Alternatively, you can just add map ctrl+l clear_terminal
#::  to_cursor_scroll active to kitty.conf which works with no changes
#::  to the shell rc files, but only clears up to the prompt, it does
#::  not clear any text at the prompt itself.

#: Clear to start

# map cmd+k clear_terminal to_cursor active

#: Clear scrollback

# map option+cmd+k clear_terminal scrollback active

#: Clear the last command

# map cmd+l clear_terminal last_command active

#: Clear screen

# map cmd+ctrl+l clear_terminal to_cursor_scroll active

#: Reload kitty.conf

# map kitty_mod+f5 load_config_file
# map ctrl+cmd+,   load_config_file

#::  Reload kitty.conf, applying any changes since the last time it
#::  was loaded. Note that a handful of options cannot be dynamically
#::  changed and require a full restart of kitty. Particularly, when
#::  changing shortcuts for actions located on the macOS global menu
#::  bar, a full restart is needed. You can also map a keybinding to
#::  load a different config file, for example::

#::      map f5 load_config /path/to/alternative/kitty.conf

#::  Note that all options from the original kitty.conf are discarded,
#::  in other words the new configuration *replace* the old ones.

#: Debug kitty configuration

# map kitty_mod+f6 debug_config
# map opt+cmd+,    debug_config

#::  Show details about exactly what configuration kitty is running
#::  with and its host environment. Useful for debugging issues.

#: Send arbitrary text on key presses

#::  E.g. map ctrl+shift+alt+h send_text all Hello World

#::  You can tell kitty to send arbitrary (UTF-8) encoded text to the
#::  client program when pressing specified shortcut keys. For
#::  example::

#::      map ctrl+alt+a send_text all Special text

#::  This will send "Special text" when you press the Ctrl+Alt+A key
#::  combination. The text to be sent decodes ANSI C escapes
#::  <https://www.gnu.org/software/bash/manual/html_node/ANSI_002dC-
#::  Quoting.html> so you can use escapes like \e to send control
#::  codes or \u21fb to send Unicode characters (or you can just input
#::  the Unicode characters directly as UTF-8 text). You can use
#::  `kitten show-key` to get the key escape codes you want to
#::  emulate.

#::  The first argument to send_text is the keyboard modes in which to
#::  activate the shortcut. The possible values are normal,
#::  application, kitty or a comma separated combination of them. The
#::  modes normal and application refer to the DECCKM cursor key mode
#::  for terminals, and kitty refers to the kitty extended keyboard
#::  protocol. The special value all means all of them.

#::  Some more examples::

#::      # Output a word and move the cursor to the start of the line (like typing and pressing Home)
#::      map ctrl+alt+a send_text normal Word\e[H
#::      map ctrl+alt+a send_text application Word\eOH
#::      # Run a command at a shell prompt (like typing the command and pressing Enter)
#::      map ctrl+alt+a send_text normal,application some command with arguments\r

#: Open kitty Website

# map shift+cmd+/ open_url https://sw.kovidgoyal.net/kitty/

#: Hide macOS kitty application

# map cmd+h hide_macos_app

#: Hide macOS other applications

# map opt+cmd+h hide_macos_other_apps

#: Minimize macOS window

# map cmd+m minimize_macos_window

#: Quit kitty

# map cmd+q quit

#: }}}

#: }}}
