# vim:fileencoding=utf-8:foldmethod=marker

#: 字体 {{{

#: kitty 提供非常强大的字体管理功能。你可以分别配置各个字型，甚至可以为
#: 特定字符指定专用字体。

font_family      monospace
bold_font        auto
italic_font      auto
bold_italic_font auto

#: 你可以为粗体、斜体和粗斜体变体分别指定不同的字体。选择字体最简单的方法
#: 是运行 `kitten choose-fonts` 命令；它会提供一个易用的界面，让你预览并
#: 选择所需字体，同时支持选择可变字体和字体特性。如果想了解如何手动选择
#: 字体，请阅读字体指定语法：
#: <https://sw.kovidgoyal.net/kitty/kittens/choose-fonts/#font-spec-
#: syntax>.

font_size 12.0

#: 字号（单位为磅，pt）。

# force_ltr no

#: kitty 不支持 BIDI（双向文本），但对于 RTL（从右向左）书写系统，其中的
#: 单词会自动按 RTL 顺序显示。也就是说，在 RTL 文本中，单词
#: “HELLO WORLD” 在 kitty 中会显示为 “WORLD HELLO”。如果尝试选择一段
#: 已按 RTL 塑形的字符串，你实际取得的字符会是该字符串按 LTR（从左向右）
#: 排列时对应位置上的字符。例如，假设有希伯来语单词 ירושלים，选中屏幕上
#: 看似为 ם 的字符时，实际写入选择缓冲区的是 י。kitty 的默认行为适合配合
#: 反转单词顺序的过滤器使用；但若要直接操作 RTL 字形，使用起来可能非常
#: 困难，因此提供此选项来关闭该行为。此外，此选项还可配合命令行程序
#: GNU FriBidi <https://github.com/fribidi/fribidi#executable> 获得 BIDI
#: 支持，因为它会强制 kitty 始终按 LTR 处理文本，这正是 FriBidi 对终端的
#: 预期。

# symbol_map

#: 示例：symbol_map U+E0A0-U+E0A3,U+E0C0-U+E0C7 PowerlineSymbols

#: 将指定的 Unicode 码位映射到特定字体。需要对某些符号（例如 Powerline
#: 符号）进行特殊渲染时很有用，并可免去使用补丁字体的需要。每个 Unicode
#: 码位都以 `U+<十六进制码位>` 的形式指定。可以指定多个码位：各码位用
#: 逗号分隔，范围用连字符连接。此选项可指定多次。语法为：

#:     symbol_map codepoints Font Family Name

# narrow_symbols

#: 示例：narrow_symbols U+E0A0-U+E0A3,U+E0C0-U+E0C7 1

#: 通常，对于 Unicode 私用区字符以及某些符号或装饰符号字符，如果字符后面
#: 跟有一个或多个空格，并且字体中的该字符具有较宽的宽高比，kitty 会利用
#: 这些额外的单元格将字符渲染得更大。通过此选项，可以强制 kitty 将指定
#: 码位限制在指定数量的单元格内渲染（默认为一个单元格）。此选项可指定
#: 多次。语法为：

#:     narrow_symbols codepoints [optionally the number of cells]

disable_ligatures cursor

#: 选择如何处理多字符连字。默认始终渲染连字。可以使用 `cursor`，让 kitty
#: 在光标位于连字上时不渲染连字，以便编辑；如果不喜欢连字，也可以使用
#: `always` 完全禁止渲染。连字策略可逐窗口设置，既可以使用 kitty 的远程
#: 控制功能，也可以在 kitty.conf 中为其定义快捷键，例如：

#:     map alt+1 disable_ligatures_in active always
#:     map alt+2 disable_ligatures_in all never
#:     map alt+3 disable_ligatures_in tab cursor

#: 请注意，这里指的是编程连字，通常由 OpenType 的 `calt` 特性实现。如需
#: 禁用一般连字，请使用 `font_features` 选项。

# font_features

#: 示例：font_features none

#: 精确选择要启用或禁用哪些 OpenType 特性。请注意，对于主字体，可以在使用
#: `choose-fonts` kitten 选择字体时指定特性。此设置主要适用于后备字体。

#: 某些字体包含值得在终端中使用的特性。例如，Fira Code 包含名为 `zero` 的
#: 可选特性，它会改变数字零（0）的外观，使其更容易与 Ø 区分。Fira Code
#: 还包含称为“样式集”（Stylistic Sets）的其他可选特性，其标签为 `ss01`
#: 到 `ss20`。

#: 各项特性的确切语法请参阅 HarfBuzz 文档：
#: <https://harfbuzz.github.io/harfbuzz-hb-common.html#hb-feature-from-string>。

#: 请注意，这里的配置以 PostScript 名称而非字体族名称作为索引。这样可以
#: 非常精确地设置特性；例如，可以只在斜体字型中禁用某项特性，而不影响
#: 常规字型。

#: 在 Linux 上，会先从 Fontconfig 数据库读取字体特性，再应用此选项，因此
#: 也可以在一个统一的中心位置配置这些特性。

#: 要获取字体的 PostScript 名称，可在 Linux 上使用 `fc-scan file.ttf`
#: 命令，或使用 macOS 上的“字体册”工具：
#: <https://apple.stackexchange.com/questions/79875/how-can-i-get-the-
#: postscript-name-of-a-ttf-font-installed-in-os-x>。

#: 启用替代样式的数字零和旧式数字：

#:     font_features FiraCode-Retina +zero +onum

#: 仅在粗体字型中启用替代样式的数字零：

#:     font_features FiraCode-Bold +zero

#: 禁用标准连字，但保留 `calt` 特性；在此字体中，该特性可减少字形的单调感：

#:     font_features TT2020StyleB-Regular -liga +calt

#: 配合 `force_ltr` 使用时，你可能希望完全禁用阿拉伯文字塑形，使文档中出现
#: 阿拉伯文字时仅显示其独立形式。例如可以这样设置：

#:     font_features UnifontMedium +isol -medi -fina -init

# modify_font

#: 修改字体特征，例如下划线和删除线的位置或粗细。修改值可以带 `px` 后缀
#: 表示像素，也可以带 `%` 后缀表示原始值的百分比；不带后缀时使用磅（pt）。
#: 例如：

#:     modify_font underline_position -2
#:     modify_font underline_thickness 150%
#:     modify_font strikethrough_thickness 200%
#:     modify_font strikethrough_position 2px

#: 此外，还可以修改各字体字形所在单元格的大小，以及字形在单元格中的基线
#: 位置。例如：

#:     modify_font cell_width 80%
#:     modify_font cell_height -2px
#:     modify_font baseline 3

#: 请注意，修改基线时，下划线和删除线的位置也会自动调整相同的量。增大基线
#: 值会使单元格内的字形上移，减小则会使其下移。缩小单元格可能产生渲染
#: 瑕疵，请谨慎使用。

# box_drawing_scale 0.001, 1, 1.5, 2

#: Unicode 方框绘制字符所用线条的粗细。这些值以磅（pt）为单位，并会根据
#: 显示器 DPI 缩放为像素值。必须提供四个值，依次对应细线、普通线、粗线和
#: 特粗线。

# undercurl_style thin-sparse

#: 波浪下划线的渲染样式。此选项的形式为
#: `(thin|thick)-(sparse|dense)`。`thin` 和 `thick` 控制波浪线粗细，
#: `sparse` 和 `dense` 控制波形振荡频率。使用 `sparse` 时，每个字符范围内
#: 出现一个波峰；使用 `dense` 时出现两个。通过重新加载配置或远程控制动态
#: 更改此选项时，其行为未定义。

# underline_exclusion 1

#: 默认情况下，当下划线与下伸部（字母位于基线以下的部分，例如 y、q、p）
#: 重叠时，kitty 会在下划线上留出缺口。此选项控制缺口的粗细。它可以是不带
#: 单位的数值，此时表示字体所指定下划线粗细的倍数；也可以带 `px` 后缀表示
#: 像素，或带 `pt` 后缀表示磅。设为零可禁用缺口。通过重新加载配置或远程
#: 控制动态更改此选项时，其行为未定义。

# text_composition_strategy platform

#: 控制 kitty 如何将文本字形合成到背景色上。默认值 `platform` 会尽量采用
#: 接近 kitty 所运行平台“原生”效果的文本渲染方式。

#: 值 `legacy` 使用 kitty 0.28 之前的旧字形合成策略。这会使浅色背景上的
#: 深色文字看起来更粗，而深色背景上的浅色文字看起来更细；也可能使某些
#: 文字的笔画看起来粗细不均。

#: 可以为此设置指定最多两个以空格分隔的数值，微调字形合成所使用的实际
#: 对比度曲线。

#: 第一个数值是伽马调整值，用于控制浅色背景上深色文字的粗细。增大此值会让
#: 文字看起来更粗。Linux 上的默认值为 1.0，macOS 上为 1.7；有效值必须
#: 大于或等于 0.01。最终效果会根据背景与前景的亮度差进行缩放。浅色背景上
#: 的深色文字会完整受到曲线影响，而深色背景上的浅色文字受到的影响很小。

#: 第二个数值是额外的乘法对比度，以 0 到 100 的百分数表示。Linux 上的
#: 默认值为 0，macOS 上为 30。

#: 如果希望文字在浅色和深色主题下看起来粗细相近，可以先将值设为 `1.0 0`
#: 并使用深色主题，然后调整第二个参数直到效果合适。接着切换到浅色主题，
#: 调整第一个参数，直至观感上的粗细与深色主题一致。

# text_fg_override_threshold 0

#: 此设置用于避免前景色与背景色之间的对比度过低。当应用程序所用颜色与你
#: 偏好的配色方案对比不足时很有用。默认值为 0，表示不覆盖颜色。它有两种
#: 工作模式：

#: 带 `ratio` 后缀的值表示可接受的前景色与背景色最小对比度，比值范围为
#: `0.0 ratio` 到 `21.0 ratio`。例如，为满足 WCAG AA 级标准：
#: <https://en.wikipedia.org/wiki/Web_Content_Accessibility_Guidelines>
#: 可以指定 `4.5 ratio`。该算法使用 HSLuv <https://www.hsluv.org/>
#: 实现，能够仅按需要调整颜色的感知明度，而基本不改变其色相和饱和度。

#: 带 `%` 后缀的值表示可接受的前景色与背景色最小亮度差；低于此值时，kitty
#: 会覆盖前景色。它是范围从 0% 到 100% 的百分数。如果前景与背景的亮度差
#: 低于此阈值，背景较暗时前景色会设为白色，背景较亮时则设为黑色。

#: 警告：某些程序使用字符（例如方块字符）显示图形，并且可能需要将前景色和
#: 背景色设为相同或相近的颜色。如果出现意外的条纹、点、线条、颜色错误、
#: 应有颜色的位置没有颜色，或任何其他图形显示问题，请尝试将
#: `text_fg_override_threshold` 设为 0，确认是否由此设置引起；也可以考虑
#: 使用上述 `ratio` 模式，而不是 `%` 模式。

#: }}}

#: 文本光标定制 {{{

# cursor #cccccc

#: 默认文本光标颜色。如果设为特殊值 `none`，光标将以“反显”效果渲染：
#: 光标颜色采用其所在单元格的文本颜色，而文本则使用该单元格的背景色渲染。
#: 请注意，如果终端中运行的程序设置了光标颜色，则以程序的设置为准。此外，
#: 当单元格的背景色与前景色对比度很低时，光标颜色也会被调整。某些主题会
#: 设置此值；若要覆盖主题设置，请将你的设置放在引入主题文件的行之后。

# cursor_text_color #111111

#: 光标下方文本的颜色。如果希望使用下方单元格的背景色来渲染文本，请使用
#: 特殊关键字 `background`。请注意，如果 `cursor` 设为 `none`，此选项将
#: 被忽略。某些主题会设置此值；若要覆盖主题设置，请将你的设置放在引入
#: 主题文件的行之后。

cursor_shape block

#: 光标形状可以是 `block`（方块）、`beam`（竖线）或 `underline`（下划线）。
#: 请注意，重新加载配置时，仅当终端中运行的程序未设置光标形状，此设置才会
#: 改变光标。这里设置的是默认光标形状，终端中运行的应用程序可以覆盖它。
#: 特别是，kitty 的 shell 集成
#: <https://sw.kovidgoyal.net/kitty/shell-integration/> 会在 shell 提示符处
#: 将光标形状设为 `beam`。可以将 `shell_integration` 设为 `no-cursor` 来
#: 避免这种行为。

cursor_shape_unfocused hollow

#: 定义 OS 窗口未获得焦点时的文本光标形状。非聚焦状态下的光标形状可以是
#: `block`（方块）、`beam`（竖线）、`underline`（下划线）、`hollow`
#: （空心方块）或 `unchanged`（保持当前光标形状不变）。

# cursor_beam_thickness 1.5

#: 竖线光标的粗细（单位为磅，pt）。

# cursor_underline_thickness 2.0

#: 下划线光标的粗细（单位为磅，pt）。

cursor_blink_interval -1

#: 光标闪烁间隔（单位为秒）。设为零可禁用闪烁，负值表示使用系统默认值。
#: 请注意，最小间隔受 `repaint_delay` 限制。还可以指定缓动函数，为光标闪烁
#: 添加动画。例如，将此选项设为 `0.5 ease-in-out`，光标会在一秒内完成一次
#: 闪烁动画：前半秒从不透明变为透明，后半秒再恢复。也可以为前后两个阶段
#: 分别指定不同的缓动函数，例如 `-1 linear ease-out`。kitty 支持所有 CSS
#: 缓动函数：
#: <https://developer.mozilla.org/en-US/docs/Web/CSS/easing-function>。
#: 请注意，启用动画会增加耗电量，因为每个闪烁周期内都需要多次重绘屏幕。
#: 另请参阅 `cursor_stop_blinking_after`。此设置也控制闪烁文本；闪烁文本会
#: 与光标完全同步闪烁。

# cursor_stop_blinking_after 15.0

#: 键盘停止活动达到指定秒数后，让光标停止闪烁。设为零表示永不停止闪烁。
#: 此设置也控制闪烁文本；闪烁文本会与光标完全同步闪烁。

# cursor_trail 0

#: 将此项设为大于零的值可启用“光标拖尾”动画。该动画会在文本光标移动时显示
#: 一条跟随其后的“拖尾”，便于追踪大幅度的光标跳转，也会产生光标在屏幕上
#: 快速移动的视觉效果。此选项的具体数值用于控制触发动画的时机，单位为
#: 毫秒。仅当光标在原位置停留的时间超过指定毫秒数时，拖尾动画才会跟随
#: 光标。这样可以避免复杂应用程序更新 UI、光标位置快速变化时产生拖尾。
#: 使用 `cursor_trail_decay` 控制动画速度，使用
#: `cursor_trail_start_threshold` 控制何时开始显示光标拖尾。

# cursor_trail_decay 0.1 0.4

#: 启用 `cursor_trail` 后，控制光标拖尾效果的衰减时间。此选项接受两个正
#: 浮点数，分别指定最快和最慢衰减时间，单位为秒。第一个值对应最快衰减
#: 时间（最小值），第二个值对应最慢衰减时间（最大值）；第二个值必须大于
#: 或等于第一个值。数值越小，光标拖尾衰减得越快。调整这两个值可以控制
#: 光标拖尾淡出的速度。

# cursor_trail_start_threshold 2

#: 设置启动光标拖尾的距离阈值。此选项接受一个正整数，表示触发拖尾前光标
#: 至少需要移动的单元格数量。当光标移动距离小于此阈值时，将跳过拖尾，
#: 从而减少不必要的光标拖尾动画。

# cursor_trail_color none

#: 启用 `cursor_trail` 后，设置光标拖尾的颜色。如果设为 `none`（默认值），
#: 光标拖尾将使用光标的背景色。否则，可以指定颜色值，例如用 `#ff0000`
#: 表示红色，或使用 `red` 这样的颜色名称。这样便可独立于光标颜色定制
#: 光标拖尾的外观。

#: }}}

#: 回滚缓冲区 {{{

scrollback_lines 32767

#: 保存在内存中、可供回滚查看的历史行数。内存按需分配；负数实际上表示
#: 无限回滚。请注意，不建议设置非常大的回滚缓冲区，因为这会降低终端性能，
#: 并可能占用大量内存。可以考虑改用 `scrollback_pager_history_size`。重新
#: 加载配置时，如果此项发生变化，只会影响新建窗口，不会影响现有窗口。

scrollbar scrolled

#: 控制何时显示滚动条。

#: scrolled
#:     开始向后回滚时显示。
#: hovered
#:     鼠标悬停在窗口右边缘时显示。
#: scrolled-and-hovered
#:     鼠标位于滚动条区域，并且已经开始向后回滚时显示。
#: always
#:     只要存在回滚内容就显示。
#: never
#:     禁用滚动条。

scrollbar_interactive yes

#: 如果禁用，将无法通过鼠标操作滚动条，所有鼠标事件都会穿透滚动条。

scrollbar_jump_on_click yes

#: 启用后，点击滚动条轨道会使滚动位置直接跳转到点击处。否则，滚动位置只会
#: 朝点击位置移动一屏，这是传统滚动条的行为。

# scrollbar_width 0.5

#: 滚动条宽度，以单元格宽度为单位。

# scrollbar_hover_width 1

#: 鼠标悬停时的滚动条宽度，以单元格宽度为单位。

# scrollbar_handle_opacity 0.5

#: 滚动条滑块的不透明度；0 表示完全透明，1 表示完全不透明。

# scrollbar_radius 0.3

#: 滚动条滑块的圆角半径（曲率），以单元格宽度为单位。该值应小于
#: `scrollbar_width`。

# scrollbar_gap 0.1

#: 滚动条与窗口边缘之间的间距，以单元格宽度为单位。

# scrollbar_min_handle_height 1

#: 滚动条滑块的最小高度，以单元格高度为单位。用于避免回滚内容很多时滑块
#: 变得过小。

# scrollbar_hitbox_expansion 0.25

#: 在滑块周围扩展额外的鼠标命中区域，使滚动条更容易抓取；以单元格宽度为
#: 单位。

# scrollbar_track_opacity 0

#: 滚动条轨道的不透明度；0 表示完全透明，1 表示完全不透明。

# scrollbar_track_hover_opacity 0.1

#: 鼠标位于滚动条上时，滚动条轨道的不透明度；0 表示完全透明，1 表示完全
#: 不透明。

# scrollbar_handle_color foreground

#: 滚动条滑块的颜色。值 `foreground` 表示使用当前文本前景色，值
#: `selection_background` 表示使用当前选择区域的背景色。也可以使用任意
#: 颜色，例如 `#12af59` 或 `red`。

# scrollbar_track_color foreground

#: 滚动条轨道的颜色。值 `foreground` 表示使用当前文本前景色，值
#: `selection_background` 表示使用当前选择区域的背景色。也可以使用任意
#: 颜色，例如 `#12af59` 或 `red`。

progress_bar top

#: 当程序使用 `OSC 9;4` 转义序列报告进度时，在窗口的指定位置绘制进度条。
#: 进度条使用与滚动条相同的样式和颜色设置。

#: left
#:     在左边缘显示垂直进度条。
#: right
#:     在右边缘显示垂直进度条。
#: top
#:     在上边缘显示水平进度条。
#: bottom
#:     在下边缘显示水平进度条。
#: hidden
#:     不显示进度条。

# scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER

#: 用于在新窗口中查看回滚内容的程序。回滚缓冲区会通过标准输入（STDIN）
#: 传给该程序。如果修改此项，请确保所用程序能够处理颜色和文本格式所使用的
#: ANSI 转义序列。上述命令行中的 `INPUT_LINE_NUMBER` 会替换为一个整数，
#: 表示应显示在屏幕顶部的行。同样，`CURSOR_LINE` 和 `CURSOR_COLUMN` 会
#: 替换为当前光标位置；如果没有光标（例如显示上一条命令的输出时），则会
#: 设为 0。

#: 如果更愿意使用 Neovim 查看回滚内容，可以采用类似下面的设置：

#:     scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -

#: 上述设置适用于 Neovim 0.12 及更高版本。还可以使用专用插件
#: kitty-scrollback.nvim
#: <https://github.com/mikesmithgh/kitty-scrollback.nvim>；它提供更多功能，
#: 并且也适用于较旧版本的 Neovim。

# scrollback_pager_history_size 0

#: 独立回滚历史的大小（单位为 MB），仅在使用分页器浏览回滚缓冲区时使用。
#: 这个独立缓冲区不能用于交互式滚动，但在单独窗口中查看回滚缓冲区时，会
#: 通过管道传给分页器程序。当前实现以 UTF-8 存储数据；对于每行 100 个
#: 字符、仅含 ASCII 且无格式的文本，每 MB 大约可保存 10000 行。设为零或
#: 负值可禁用此功能，允许的最大值为 4 GB。重新加载配置时，如果此项发生
#: 变化，只会影响新建窗口，不会影响现有窗口。

# scrollback_fill_enlarged_window no

#: 放大窗口后，使用回滚缓冲区中的内容填充新增空间。

# wheel_scroll_multiplier 5.0

#: 鼠标滚轮滚动行数的倍数。请注意，此项只用于低精度滚动设备，不适用于
#: macOS 和 Wayland 等平台上的高精度滚动设备。使用负数可以反转滚动方向。
#: 另请参阅 `wheel_scroll_min_lines`。

# wheel_scroll_min_lines 1

#: 鼠标滚轮滚动的最小行数。达到此行数后，滚动倍数
#: `wheel_scroll_multiplier` 才会生效。请注意，此项只用于低精度滚动设备，
#: 例如每次滚轮操作只产生很小滚动量的滚轮鼠标。设为负数时，总会额外加上
#: 此最小行数。

# touch_scroll_multiplier 1.0

#: 触摸板滚动行数的倍数。请注意，此项只用于 macOS 和 Wayland 等平台上的
#: 高精度滚动设备。使用负数可以反转滚动方向。

# pixel_scroll yes

#: 使用高精度输入设备（例如触摸板）时，在 kitty 的回滚缓冲区中启用逐像素
#: 滚动。启用后，kitty 自身的回滚可以按不足一整行的增量移动，而不再只能
#: 按整行移动。此项不会影响终端内自行处理滚动的应用程序，例如全屏 TUI。

# momentum_scroll 0.96

#: 用于减缓动量（惯性）滚动的摩擦系数。取值范围为 0 到 1；0 表示不使用
#: 动量滚动，1 表示无限滚动。请注意，此设置仅适用于 Wayland 等不提供原生
#: 动量滚动的平台；在 macOS 上使用操作系统原生的动量滚动。此外，动量滚动
#: 仅适用于触摸板和触摸屏等基于手指操作的设备。对此设置的更改只有在重启
#: kitty 后才会生效。

#: }}}

#: 鼠标 {{{

mouse_hide_wait 0.0

#: 鼠标闲置指定秒数后隐藏鼠标指针。设为零可禁用鼠标指针隐藏；设为负值则会
#: 在输入文本时立即隐藏鼠标指针。此功能在 macOS 上默认禁用，因为要让它在
#: Cocoa 那片不断变化的 bug 海洋中稳定工作，实在需要花费太多精力。

#: 默认情况下，指针隐藏后，任何后续鼠标事件都会立即使其重新显示。

#: 支持以下两种格式：
#:  - <hide-wait>
#:  - <hide-wait> <unhide-wait> <unhide-threshold> <scroll-unhide>

#: 若要更改重新显示指针的行为，可以设置可选参数 `<unhide-wait>`、
#: `<unhide-threshold>` 和 `<scroll-unhide>`。

#: <unhide-wait>
#:     发生鼠标事件后等待指定秒数，再重新显示鼠标指针。设为零表示检测到
#:     鼠标活动后立即显示。这可避免意外划过触摸板时误将鼠标指针唤出。

#: <unhide-threshold>
#:     当 `<unhide-wait>` 不为零时，设置重新显示鼠标指针所需的鼠标活动
#:     阈值。当 `<unhide-wait>` 为零时，此项无效。

#:     例如，如果 `<unhide-threshold>` 为 40、`<unhide-wait>` 为 2.5，
#:     kitty 检测到鼠标事件后，会统计接下来 2.5 秒内的鼠标事件数量，并
#:     检查其是否超过 `40 * 2.5 = 100`。如果超过，就重新显示鼠标指针；
#:     否则不执行任何操作。

#: <scroll-unhide>
#:     控制哪些鼠标事件可以重新显示鼠标指针。启用后，滚动和移动事件都能
#:     使指针重新显示；禁用后，只有鼠标移动可以使其重新显示。

#: 有效值示例：
#:  - 0.0
#:  - 1.0
#:  - -1.0
#:  - 0.1 3.0 40 yes

# url_color #0087bd
# url_style curly

#: 鼠标悬停时突出显示 URL 所使用的颜色和样式。`url_style` 可以是：
#: `none`、`straight`、`double`、`curly`、`dotted` 或 `dashed`。

# open_url_with default

#: 用于打开所点击 URL 的程序。特殊值 `default` 会先查找通过 `open_actions`
#: <https://sw.kovidgoyal.net/kitty/open_actions/> 功能定义的 URL 处理器；
#: 如果没有找到，则使用操作系统的默认 URL 处理器（macOS 上为 `open`，
#: Linux 上为 `xdg-open`）。

# url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh

#: 检测鼠标指针下方的 URL 时要识别的一组 URL 前缀。

# detect_urls yes

#: 检测鼠标下方的 URL。检测到的 URL 会用下划线突出显示，鼠标悬停其上时
#: 指针会变成手形。即使禁用此选项，URL 仍然可以点击。另请参阅
#: `underline_hyperlinks` 选项，它用于控制超链接（区别于纯文本 URL）的
#: 显示方式。

# url_excluded_characters

#: 检测鼠标指针下方的 URL 时，额外禁止出现在 URL 中的字符。默认允许 URL
#: 中所有合法字符。另外也允许换行符，但会将其移除；这是为了兼容 mutt 等
#: 即使一行尚未结束也会插入硬换行的程序。可以将 `\n` 加入此选项以禁用
#: 这种行为。特殊字符可使用反斜杠转义来指定；若要指定反斜杠本身，请使用
#: 两个反斜杠。

# show_hyperlink_targets never

#: 鼠标悬停在终端超链接上时，显示点击该超链接后实际会打开的 URL。设为
#: `ctrl`、`cmd`、`alt` 或 `shift`，可以只在按住相应修饰键时显示（Ctrl、
#: Super〔macOS 上的 Cmd〕、Alt 或 Shift）。同时按下多个修饰键时，只要
#: 其中包含所配置的修饰键就会显示 URL。设为 `always` 表示始终显示，设为
#: `never` 表示永不显示。

# underline_hyperlinks hover

#: 控制超链接的下划线显示方式：可以仅在鼠标悬停时显示、始终显示（即永久
#: 添加下划线），或者从不显示；后者表示 kitty 不会为超链接应用任何下划线
#: 样式。请注意，`always` 只适用于真正的 `OSC 8` 超链接，不适用于鼠标悬停
#: 时检测出的纯文本 URL。下划线样式使用 `url_style` 和 `url_color` 设置。
#: 重新加载配置并将此值改为或改出 `always` 时，只会影响 kitty 此后接收到
#: 的文本。

# copy_on_select no

#: 选中文本时，将其复制到剪贴板或私有缓冲区。将此项设为 `clipboard` 后，
#: 使用鼠标选择文本会将其复制到剪贴板。这适用于 macOS 等没有“主选择区”
#: 概念的平台。也可以指定 `a1` 之类的名称，将文本复制到 kitty 私有缓冲区。
#: 可以为 `paste_from_buffer` 操作映射快捷键，以便从该私有缓冲区粘贴。
#: 例如：

#:     copy_on_select a1
#:     map shift+cmd+v paste_from_buffer a1

#: 请注意，复制到剪贴板存在安全风险，因为所有程序（包括浏览器中打开的
#: 网站）都可以读取系统剪贴板的内容。

# clear_selection_on_clipboard_loss no

#: 当剪贴板内容不再与当前选择内容一致时，清除当前选择。此选项主要适用于
#: Linux 等平台；在这些平台上，选择文本会自动将其复制到特殊的“主选择区”
#: 剪贴板。将 `copy_on_select` 设为 `clipboard` 时，此选项也很有用。

#: 请注意，macOS 不会在剪贴板所有者发生变化时提供通知。因此在 macOS 上，
#: 即使启用了 `copy_on_select`，在 kitty 以外的应用程序中复制内容也不会
#: 清除选择。

# paste_actions quote-urls-at-prompt,confirm

#: 向终端粘贴或拖放文本时执行的操作列表，各项以逗号分隔。支持的粘贴操作
#: 如下：

#: quote-urls-at-prompt:
#:     如果要粘贴的文本是 URL，并且光标位于 shell 提示符处，则自动为 URL
#:     加上引号（需要 `shell_integration`）。
#: replace-dangerous-control-codes
#:     替换粘贴文本中的危险控制码，不要求确认。
#: replace-newline
#:     替换粘贴文本中的换行符，不要求确认。
#: confirm:
#:     如果要粘贴的文本包含任何终端控制码，则要求确认。此类内容可能存在
#:     危险；如果终端中运行的 shell 或程序未正确处理，可能导致代码执行。
#: confirm-if-large
#:     如果粘贴内容很大（超过 16 KB），则要求确认，因为向 shell 粘贴大量
#:     文本可能非常缓慢。
#: filter:
#:     使用 kitty 配置目录中 `paste-actions.py` 文件内的 `filter_paste()`
#:     函数处理粘贴文本。实际粘贴的是该函数返回的文本。
#: no-op:
#:     不执行任何操作。

# strip_trailing_spaces never

#: 复制到剪贴板时移除行尾空格。值 `smart` 表示对普通选择执行此操作，但不
#: 处理矩形选择；值 `always` 表示始终执行。

# select_by_word_characters @-./_~?&=%+#

#: 双击选择时视为单词组成部分的字符。除这些字符外，Unicode 数据库中标记为
#: 字母或数字的所有字符也会匹配。

# select_by_word_characters_forward

#: 双击并向前扩展选择时视为单词组成部分的字符。除这些字符外，Unicode
#: 数据库中标记为字母或数字的所有字符也会匹配。

#: 如果留空（默认），两个方向都使用 `select_by_word_characters`。

# click_interval -1.0

#: 用于识别双击和三击的连续点击间隔（单位为秒）。负数表示使用系统默认值；
#: 如果系统默认值不可用，则回退到 0.5。

# focus_follows_mouse no

#: 当鼠标进入另一个窗口时，将鼠标下方的窗口设为活动窗口。鼠标在同一窗口内
#: 移动时，活动窗口不会改变，因此意外碰动鼠标不会撤销通过键盘进行的窗口
#: 切换。设为 `drop` 表示只有在窗口中发生拖放时才改变焦点。在 macOS 上，
#: 只要 kitty 是当前活动应用，鼠标进入某个 OS 窗口时还会自动聚焦该窗口。

# pointer_shape_when_grabbed arrow

#: 终端中运行的程序捕获鼠标时，鼠标指针的形状。

# default_pointer_shape beam

#: 鼠标指针的默认形状。

# pointer_shape_when_dragging beam crosshair

#: 在文本上拖动时鼠标指针的默认形状。可选的第二个值设置在矩形选择模式下
#: 拖动时的指针形状。

# drag_threshold 5

#: 启动拖放前鼠标必须移动的距离阈值。标签页和窗口都支持拖动。可以拖动标签页
#: 来重新排序、将其分离为新的 OS 窗口，或将其移至另一个 OS 窗口。同样，
#: 通过拖动窗口标题栏（参见 `toggle_window_title_bars`），可以在布局中重新
#: 排列窗口、将其分离，或将其移至另一个标签页。设为零可禁用所有拖动操作。

#: 请注意，由于 Wayland 的设计缺陷：
#: <https://gitlab.freedesktop.org/wayland/wayland/-/issues/140>
#: 取消拖动会导致标签页被分离。对于支持 `xdg-toplevel-drag` 的合成器，
#: kitty 已规避此问题：
#: <https://wayland.app/protocols/xdg-toplevel-drag-v1>。

#: 鼠标操作 {{{

#: 可以将鼠标按键映射为执行任意操作。语法如下：

#: .. code-block:: none

#:     mouse_map button-name event-type modes action

#: 其中，`button-name` 可以是附加了键盘修饰键的 `left`、`middle`、`right`
#: 或 `b1` … `b8`。例如，`ctrl+shift+left` 表示按住 Ctrl+Shift 键并点击
#: 鼠标左键。`b1` … `b8` 可用于表示鼠标上最多八个按键。

#: `event-type` 可以是 `press`、`release`、`doublepress`、`triplepress`、
#: `click` 或 `doubleclick`。`modes` 表示鼠标被终端内运行的程序捕获时或
#: 未被捕获时是否执行该操作。其值可以是 `grabbed`、`ungrabbed`，也可以是
#: 由逗号分隔的二者组合。`grabbed` 表示终端内运行的程序已经请求接收鼠标
#: 事件。请注意，`click` 和 `doubleclick` 事件会延迟 `click_interval`
#: 指定的时间，以便与双击和三击按下事件相区分。

#: 可以使用 `kitty --debug-input` 命令行选项运行 kitty，以查看鼠标事件。
#: 下面列出的内置操作可以帮助你了解可实现的功能。

#: 若要取消某个按键的映射，请将它映射为空操作。例如，禁止使用普通点击打开
#: URL：

#:     mouse_map left click ungrabbed

#: 所有可映射的操作（包括鼠标操作）参见：
#: <https://sw.kovidgoyal.net/kitty/actions/>。

#: .. note::
#:     开始选择后，松开用于启动选择的按键会自动结束选择，并且不会分派
#:     `release` 事件。

# clear_all_mouse_actions no

#: 移除在此行之前定义的所有鼠标操作。例如，可用于移除默认鼠标操作。

#: 点击鼠标下方的链接或移动光标

# mouse_map left click ungrabbed mouse_handle_click selection link prompt

#::  首先检查是否存在选择；如果存在，则不执行任何操作。然后检查鼠标指针
#::  下方是否有链接；如果有，则点击该链接。最后检查点击是否发生在当前
#::  shell 提示符处；如果是，则将光标移至点击位置。请注意，此功能需要
#::  shell 集成才能工作：
#::  <https://sw.kovidgoyal.net/kitty/shell-integration/>。

#: 即使鼠标已被捕获，也点击鼠标下方的链接或移动光标

# mouse_map shift+left click grabbed,ungrabbed mouse_handle_click selection link prompt

#::  与上面的操作相同，但即使鼠标已被终端中运行的程序捕获，也会执行该操作。

#: 点击鼠标指针下方的链接

# mouse_map ctrl+shift+left release grabbed,ungrabbed mouse_handle_click link

#::  之所以提供 Ctrl+Shift 变体，是因为基于普通点击的版本不可避免地会有
#::  `click_interval` 指定的延迟，以便区分单击和双击。

#: 丢弃用于点击链接的按下事件

# mouse_map ctrl+shift+left press grabbed discard_event

#::  阻止将此按下事件发送给已经捕获鼠标的程序，因为与之对应的松开事件会
#::  用于打开 URL。

#: 从主选择区粘贴

# mouse_map middle release ungrabbed paste_from_selection

#: 开始选择文本

# mouse_map left press ungrabbed mouse_selection normal

#::  如果希望拖放超链接或检测到的 URL，请使用 `drag_or_normal_select` 替代
#::  `normal`。这样，当鼠标下方存在超链接时，会根据 `drag_threshold`
#::  启动拖动；否则执行普通选择。

#: 开始以矩形方式选择文本

# mouse_map ctrl+alt+left press ungrabbed mouse_selection rectangle

#: 选择一个单词

# mouse_map left doublepress ungrabbed mouse_selection word

#: 选择一行

# mouse_map left triplepress ungrabbed mouse_selection line

#: 从第一个单元格开始选择整行

# mouse_map alt+left triplepress ungrabbed mouse_selection line_from_begin

#: 从指定位置开始选择一行

# mouse_map ctrl+alt+left triplepress ungrabbed mouse_selection line_from_point

#::  从点击位置选择到行尾。如果希望先选择该位置的单词，再将选择扩展到该行
#::  其余部分，请将 `line_from_point` 改为 `word_and_line_from_point`。

#: 扩展当前选择

# mouse_map right press ungrabbed mouse_selection extend

#::  如果只想移动选择的末端，而不是离点击位置最近的边界，请使用 `move-end`
#::  替代 `extend`。

#: 使用 Shift 扩展当前选择

# mouse_map shift+left press ungrabbed mouse_selection extend

#::  如果只想移动选择的末端，而不是离点击位置最近的边界，请使用 `move-end`
#::  替代 `extend`。

#: 即使鼠标已被捕获，也从主选择区粘贴

# mouse_map shift+middle release ungrabbed,grabbed paste_selection
# mouse_map shift+middle press grabbed discard_event

#: 即使鼠标已被捕获，也开始选择文本

# mouse_map shift+left press grabbed mouse_selection normal

#: 即使鼠标已被捕获，也开始以矩形方式选择文本

# mouse_map ctrl+shift+alt+left press ungrabbed,grabbed mouse_selection rectangle

#: 即使鼠标已被捕获，也选择一个单词

# mouse_map shift+left doublepress ungrabbed,grabbed mouse_selection word

#: 即使鼠标已被捕获，也选择一行

# mouse_map shift+left triplepress ungrabbed,grabbed mouse_selection line

#: 即使鼠标已被捕获，也从第一个单元格开始选择整行

# mouse_map shift+alt+left triplepress ungrabbed,grabbed mouse_selection line_from_begin

#: 即使鼠标已被捕获，也从指定位置开始选择一行

# mouse_map ctrl+shift+alt+left triplepress ungrabbed,grabbed mouse_selection line_from_point

#::  即使鼠标已被捕获，也从点击位置选择到行尾。如果希望先选择该位置的单词，
#::  再将选择扩展到该行其余部分，请将 `line_from_point` 改为
#::  `word_and_line_from_point`。

#: 即使鼠标已被捕获，也扩展当前选择

# mouse_map shift+right press ungrabbed,grabbed mouse_selection extend

#: 在分页器中显示所点击命令的输出

# mouse_map ctrl+shift+right press ungrabbed mouse_show_command_output

#::  需要 shell 集成才能工作：
#::  <https://sw.kovidgoyal.net/kitty/shell-integration/>。

#: }}}

#: }}}

#: 性能调优 {{{

# repaint_delay 10

#: 两次屏幕更新之间的延迟（单位为毫秒）。减小此值可以提高每秒帧数（FPS），
#: 但会增加 CPU 占用。默认值可达到约 100 FPS，对绝大多数用途而言绰绰有余。
#: 请注意，若要真正达到 100 FPS，需要将 `sync_to_monitor` 设为 `no`，或者
#: 使用高刷新率显示器。此外，当存在等待处理的输入时，为了尽可能降低延迟，
#: kitty 会忽略此选项。

# input_delay 3

#: 处理终端内运行程序所传入数据之前的延迟（单位为毫秒）。减小此值会提高
#: 响应速度，但也会增加 CPU 占用，并且可能使每次循环都重绘整个屏幕的
#: 全屏程序发生闪烁；这是因为 kitty 速度很快，会将尚未完成的局部屏幕更新
#: 绘制出来。当输入缓冲区接近满载时，kitty 会忽略此设置。

sync_to_monitor yes

#: 使屏幕更新与显示器刷新率同步。这样可以避免滚动时出现画面撕裂：
#: <https://en.wikipedia.org/wiki/Screen_tearing>。
#: 但这也会把渲染速度限制在显示器的刷新率以内。使用速度非常快的鼠标或较高
#: 的键盘重复速率时，可能会感觉到轻微的输入延迟；如果出现这种情况，请将
#: 此项设为 `no`。

#: }}}

#: 终端响铃 {{{

enable_audio_bell yes

#: 是否启用音频响铃。在需要保持安静的环境中，可以将其禁用。

# visual_bell_duration 0.0

#: 视觉响铃的持续时间（单位为秒）。发生响铃时，让屏幕闪烁指定的秒数。设为
#: 零可禁用。闪烁采用动画效果，在指定的持续时间内淡入和淡出。可以控制淡入
#: 淡出所使用的缓动函数。例如，`2.0 linear` 会使闪烁在两秒内线性淡入和
#: 淡出。如果未指定，默认使用 `ease-in-out`，它会在动画的开始、中间和
#: 结束阶段缓慢变化。也可以为淡入和淡出阶段分别指定不同的缓动函数，例如
#: `2.0 ease-in linear`。kitty 支持所有 CSS 缓动函数：
#: <https://developer.mozilla.org/en-US/docs/Web/CSS/easing-function>。

# visual_bell_color none

#: 视觉响铃使用的颜色。设为 `none` 时，会回退到选择区域的背景色。如果觉得
#: 视觉响铃过亮，可以将其设为较暗的颜色。

# window_alert_on_bell yes

#: 响铃时请求用户关注窗口。这会使 macOS 上的程序坞图标弹跳，或使 Linux
#: 上的任务栏闪烁。

# bell_on_tab "🔔 "

#: 如果标签页中某个未获得焦点的窗口发生响铃，在该标签页上显示的文本或
#: Unicode 符号。如果需要保留文本开头或末尾的空格，请用引号将文本括起来。
#: 具体渲染方式参见 `tab_title_template`。

#: 为保持向后兼容，值 `yes`、`y` 和 `true` 会转换为默认响铃符号；值 `no`、
#: `n`、`false` 和 `none` 会转换为空字符串。

# command_on_bell none

#: 发生响铃时运行的程序。可以通过环境变量 `KITTY_CHILD_CMDLINE` 获取响铃
#: 所在窗口中正在运行的程序。

# macos_dock_badge_on_bell yes

#: 发生响铃且 kitty 不是活动应用时，在 kitty 的程序坞图标上显示标记（仅限
#: macOS）。kitty 重新获得焦点后，该标记会自动清除。

# bell_path none

#: 用作响铃声音的音频文件路径。如果设为 `none`，则使用系统默认响铃声。
#: 文件格式必须受操作系统的声音 API 支持，例如 Linux（libcanberra）上的
#: WAV 或 OGA，以及 macOS（NSSound）上的 AIFF、MP3 或 WAV。相对路径以
#: kitty 配置目录为基准进行解析。

# linux_bell_theme __custom

#: kitty 播放响铃声时使用的 XDG 声音主题。在 Wayland 上，如果合成器支持
#: 相应协议，kitty 会请求合成器播放系统默认响铃声，此设置不会生效。请注意，
#: Hyprland 声称支持该协议，但实际上不会播放声音：
#: <https://github.com/hyprwm/Hyprland/issues/10488>。
#: 此设置默认为 XDG 声音主题规范中指定的自定义主题名称：
#: <https://specifications.freedesktop.org/sound-theme-spec/latest/sound_lookup.html>。
#: 如果该主题不存在，则回退到默认的 freedesktop 主题。若要为整个桌面环境
#: 更改声音主题，请创建文件 `~/.local/share/sounds/__custom/index.theme`，
#: 内容如下：

#:     [Sound Theme]

#:     Inherits=name-of-the-sound-theme-you-want-to-use

#: 将 `name-of-the-sound-theme-you-want-to-use` 替换为实际的主题名称。此后，
#: 所有遵循该规范的应用程序都应使用此主题中的声音。

#: }}}

#: 窗口布局 {{{

# remember_window_size  yes
# initial_window_width  640
# initial_window_height 400

#: 启用后会记住 OS 窗口的大小，使新启动的 kitty 实例与上一个实例大小相同。
#: 禁用后，OS 窗口的初始大小由 `initial_window_width` 和
#: `initial_window_height` 配置，单位为像素。可以为宽度或高度值添加 `c`
#: 后缀，使其解释为单元格数量而不是像素数。

remember_window_position no

#: 启用后会记住 OS 窗口的位置，使新启动的 kitty 实例与上一个实例位于相同
#: 位置。禁用后，由窗口管理器放置 OS 窗口。请注意，只有底层桌面环境或窗口
#: 管理器支持时才能记住位置；此功能在 Wayland 上始终无效。启动 kitty 时
#: 如需指定位置，另请参阅 `kitty --position`。

# enabled_layouts *

#: 启用的窗口布局，以逗号分隔布局名称。特殊值 `all` 表示启用所有布局。
#: 列出的第一个布局会用作启动布局。默认配置是按字母顺序排列的所有布局。
#: 可用布局列表参见：
#: <https://sw.kovidgoyal.net/kitty/overview/#layouts>。

# window_resize_step_cells 2
# window_resize_step_lines 2

#: 使用 `start_resizing_window` 快捷键调整布局中 kitty 窗口大小时采用的步长，
#: 单位为单元格宽度或高度。`cells` 值用于水平方向，`lines` 值用于垂直方向。

window_border_width 0.0pt

#: 窗口边框宽度。单位可以是像素（px）或磅（pt）。以磅为单位的值会根据屏幕
#: 分辨率舍入为最接近的像素数。未指定单位时，默认使用磅。请注意，只有同时
#: 显示多个窗口时才会显示边框；边框用于分隔这些窗口。

draw_minimal_borders yes

#: 仅绘制必要的最少边框，即只绘制将当前窗口与相邻窗口分隔开的边框。请注意，
#: 将 `window_margin_width` 设为非零值会覆盖此设置，使所有边框都被绘制。

draw_window_borders_for_single_window no

#: 即使只有一个窗口可见，也在其周围绘制边框。启用后，当只有一个窗口时，
#: 会在其四周绘制完整边框，如同 `draw_minimal_borders` 为 `false`。当该窗口
#: 获得焦点且 OS 窗口也有焦点时，边框使用活动颜色；OS 窗口失去焦点时，
#: 边框使用非活动颜色。这样可以清楚地指示 kitty 窗口是否获得焦点。显示
#: 多个窗口时，此选项无效，并采用正常的边框绘制规则。

window_margin_width 0

#: 窗口外边距（单位为磅），即边框外侧的空白区域。一个值设置四边；两个值
#: 依次设置垂直和水平边距；三个值依次设置上边、水平边和下边；四个值依次
#: 设置上、右、下、左边距。

# single_window_margin_width -1

#: 只有一个窗口可见时使用的窗口外边距（单位为磅）。设为负值时，改用
#: `window_margin_width` 的值。一个值设置四边；两个值依次设置垂直和水平
#: 边距；三个值依次设置上边、水平边和下边；四个值依次设置上、右、下、左
#: 边距。

window_padding_width 0

#: 窗口内边距（单位为磅），即文本与窗口边框之间的空白区域。一个值设置四边；
#: 两个值依次设置垂直和水平内边距；三个值依次设置上边、水平边和下边；四个
#: 值依次设置上、右、下、左内边距。

# single_window_padding_width -1

#: 只有一个窗口可见时使用的窗口内边距（单位为磅）。设为负值时，改用
#: `window_padding_width` 的值。一个值设置四边；两个值依次设置垂直和水平
#: 内边距；三个值依次设置上边、水平边和下边；四个值依次设置上、右、下、
#: 左内边距。

# placement_strategy center

#: 当窗口大小不是单元格大小的整数倍时，终端窗口的单元格区域四周会出现一些
#: 额外空白。此选项控制这些空白如何分布。值 `center` 表示将单元格区域居中；
#: 值 `top-left` 表示只在下边和右边留出空白。可用值为：`top-left`、`top`、
#: `top-right`、`left`、`center`、`right`、`bottom-left`、`bottom` 和
#: `bottom-right`。

# active_border_color #00ff00

#: 活动窗口的边框颜色。设为 `none` 可不在活动窗口周围绘制边框。

# inactive_border_color #cccccc

#: 非活动窗口的边框颜色。

# bell_border_color #ff5a00

#: 发生过响铃的非活动窗口所使用的边框颜色。

# inactive_text_alpha 1.0

#: 按指定程度淡化非活动窗口中的文本。取值必须在 -1 到 1 之间，其绝对值控制
#: 实际不透明度：0 表示完全淡出，1 表示完全不透明。使用正数时，如果 OS
#: 窗口未获得焦点，即使只有一个 kitty 窗口可见也会淡化文本。使用负数时，
#: 只有一个 OS 窗口内显示多个 kitty 窗口才会淡化文本。除活动窗口之外，
#: 所有窗口都会淡化，即使 OS 窗口没有焦点也是如此。因此，可以让窗口管理器
#: 指示 OS 窗口的焦点，并用此功能指示 OS 窗口内部哪个 kitty 窗口处于活动
#: 状态。

hide_window_decorations yes

#: 设为 `yes` 可隐藏窗口装饰（标题栏和窗口边框）。在 macOS 上，可以使用
#: `titlebar-only` 或 `titlebar-and-corners`，分别隐藏标题栏，或同时隐藏
#: 标题栏和圆角。

#: 在 Wayland 上，`titlebar-only` 可隐藏标题栏，同时保留用于调整大小的窗口
#: 阴影。在提供服务端窗口装饰的合成器上（基本上除 GNOME 外均如此），`yes`
#: 和 `titlebar-only` 都会强制使用客户端窗口装饰模式。

#: 此选项是否有效及其确切效果取决于窗口管理器和操作系统。请注意，重新加载
#: 配置时更改此选项，其效果未定义。在 macOS 上使用 `titlebar-only` 时，
#: 最好同时设置 `window_margin_width` 和 `placement_strategy`，以防圆角裁切
#: 文本；也可以改用 `titlebar-and-corners`。

# window_logo_path none

#: 徽标图像的路径。图像必须为 PNG、JPEG、WEBP、GIF、TIFF 或 BMP 格式。
#: 相对路径以 kitty 配置目录为基准进行解析。徽标会显示在每个 kitty 窗口的
#: 一角，其位置由 `window_logo_position` 控制。可以使用 `launch` 操作或
#: 远程控制功能，为各个窗口配置不同的徽标：
#: <https://sw.kovidgoyal.net/kitty/remote-control/>。

# window_logo_position bottom-right

#: 窗口徽标在窗口中的位置。可用值为：`top-left`、`top`、`top-right`、
#: `left`、`center`、`right`、`bottom-left`、`bottom` 和 `bottom-right`。

# window_logo_alpha 0.5

#: 徽标融入背景的程度。0 表示完全淡出，1 表示完全不透明。

# window_logo_scale 0

#: 徽标相对于窗口大小的缩放百分比，取值范围为 (0, 100]。使用一个数值时，
#: 会保持徽标图像的宽高比，并将其缩放到窗口较短边的相应百分比。

#: 使用两个数值时，徽标的宽度和高度会分别缩放到窗口宽度和高度的相应
#: 百分比。

#: 某一维度的百分比设为零会禁用该维度的缩放。只指定一个零（默认值）会
#: 禁用窗口徽标的所有缩放。

# resize_debounce_time 0.1 0.5

#: 实时调整 OS 窗口大小期间，在停止收到新的调整事件后（即调整暂停或结束时），
#: 等待多久才通知 kitty 内运行的程序调整大小并重绘屏幕，单位为秒。在 macOS
#: 等操作系统会发送实时调整开始和结束事件的平台上，kitty 能区分暂停和结束，
#: 因此第二个数值用于设置暂停后的重绘延迟。在这些系统上，第一个数值会被
#: 忽略，并在调整结束后立即重绘。在其他系统上只使用第一个数值，使 kitty
#: 能在调整结束后迅速“就绪”，同时避免持续重绘以节省能源。

# resize_in_steps no

#: 以单元格大小为步长调整 OS 窗口，而不是采用通常的像素精度。配合以单元格
#: 数量设置的 `initial_window_width` 和 `initial_window_height`，可以在调整
#: OS 窗口大小时尽可能缩小外边距。请注意，此功能目前不适用于 Wayland。

# visual_window_select_characters 1234567890ABCDEFGHIJKLMNOPQRSTUVWXYZ

#: 可视化窗口选择所使用的字符列表，例如通过 `focus_visible_window` 选择要
#: 聚焦的窗口。该值应为一串不重复的字符，大小写不敏感，并从集合
#: ``0-9A-Z\-=[];',./\\` `` 中选取。请按偏好将其指定为一个字符串。

# confirm_os_window_close -1

#: 当一个 OS 窗口或标签页中至少包含此数量的 kitty 窗口，并且通过窗口管理器
#: （例如点击关闭按钮或按下操作系统的关闭窗口快捷键）或 `close_tab` 操作
#: 将其关闭时，要求确认。设为零可禁用确认。退出整个应用程序的请求（即通过
#: `quit` 操作关闭所有 OS 窗口）也会要求此确认。负值会转换为正值；但启用
#: `shell_integration` 后，使用负值表示不计入停留在 shell 提示符处的窗口，
#: 只计算当前正在运行命令的窗口。还可以向设置中添加 `count-background`，
#: 使后台作业阻止关闭，例如 `-1 count-background`。如果希望关闭单个窗口时
#: 要求确认，可以映射 `close_window_with_confirmation` 操作。

# window_drag_tolerance 2

#: 控制通过拖动窗口边框来调整 kitty 窗口大小。此值是窗口边框周围可触发拖动
#: 的区域容差，单位为磅；在该区域按下鼠标左键会开始拖动窗口边框。使用较大
#: 的负值（例如 -200）可禁用边框拖动。请注意，由于 kitty 使用布局，拖动
#: 边框实际调整的不是窗口本身，而是布局中的行、列或槽位，因此可能会同时
#: 改变多个窗口的大小。

# window_title_bar top

#: 控制窗口标题栏相对于窗口内容的位置。使用 `window_title_bar_min_windows`
#: 控制何时显示标题栏，使用 `window_title_template` 设置所显示窗口标题的
#: 格式。

# window_title_bar_min_windows 0

#: 标签页中显示窗口标题栏所需的最少可见窗口数。0 表示永不显示，1 表示始终
#: 显示，2 或更大的值表示至少有相应数量的窗口可见时才显示。此设置类似于
#: 标签栏的 `tab_bar_min_tabs`。

# window_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{fmt.fg.window}{progress_percent}{title}"

#: 用于渲染窗口标题栏文本的模板，使用与 `tab_title_template` 相同的模板语法。
#: 可用变量包括：`{title}`、`{bell_symbol}`、`{activity_symbol}`、
#: `{progress_percent}`、`{custom}`、`{fmt}` 和 `{is_active}`。还可以在 kitty
#: 配置目录的 `window_title_bar.py` 中提供自定义的
#: `draw_window_title(data)` 函数，其结果通过 `{custom}` 暴露给模板。

# active_window_title_template none

#: 活动窗口标题栏使用的模板。如果未设置（值为 `none`），则使用
#: `window_title_template`。

# window_title_bar_active_foreground none

#: 活动窗口标题栏的前景色。设为 `none` 时，默认使用对应的标签栏颜色
#: `active_tab_foreground`。

# window_title_bar_active_background none

#: 活动窗口标题栏的背景色。设为 `none` 时，默认使用对应的标签栏颜色
#: `active_tab_background`。

# window_title_bar_inactive_foreground none

#: 非活动窗口标题栏的前景色。设为 `none` 时，默认使用对应的标签栏颜色
#: `inactive_tab_foreground`。

# window_title_bar_inactive_background none

#: 非活动窗口标题栏的背景色。设为 `none` 时，默认使用对应的标签栏颜色
#: `inactive_tab_background`。

# window_title_bar_align center

#: 窗口标题栏中文本的水平对齐方式。

#: }}}

#: 标签栏 {{{

# tab_bar_edge bottom

#: 显示标签栏的边缘，可设为顶部或底部。

# tab_bar_margin_width 0.0

#: 标签栏左右两侧的外边距（单位为磅，pt）。

# tab_bar_margin_height 0.0 0.0

#: 标签栏上方和下方的外边距（单位为磅，pt）。第一个数值表示 OS 窗口边缘与
#: 标签栏之间的距离，第二个数值表示标签栏与当前标签页内容之间的距离。

# tab_bar_style fade

#: 标签栏样式，可以是以下值之一：

#: fade
#:     每个标签页的边缘逐渐融入背景色。另请参阅 `tab_fade`。
#: slant
#:     标签页呈现为实体文件夹标签的样式。
#: separator
#:     使用可配置的分隔符分隔标签页。另请参阅 `tab_separator`。
#: powerline
#:     将标签页显示为一条连续的栏，并使用“花式”分隔符。另请参阅
#:     `tab_powerline_style`。
#: custom
#:     从 kitty 配置目录的 `tab_bar.py` 文件中加载用户提供的 Python 函数
#:     `draw_tab`。有关此类函数的编写示例，请查看 kitty 源码
#:     `kitty/tab_bar.py` 中名称为 `draw_tab_with_*` 的函数。kitty 用户提供的
#:     示例另见此讨论：
#:     <https://github.com/kovidgoyal/kitty/discussions/4447>。
#: hidden
#:     隐藏标签栏。使用此值时，可以为 `select_tab` 操作创建映射；该操作会
#:     显示标签页列表，便于切换标签页。

# tab_bar_filter

#: 搜索表达式：
#: <https://sw.kovidgoyal.net/kitty/remote-control/#search-syntax>。
#: 标签栏中只显示匹配该表达式的标签页。无论是否匹配，当前活动标签页始终会
#: 显示。使用此选项时，标签栏显示的标签页数量可能少于 `tab_bar_min_tabs`
#: 指定的数量，因为计算过滤器的开销较大，只会在显示时执行。此功能在使用
#: 会话时最为实用：<https://sw.kovidgoyal.net/kitty/sessions/>。表达式
#: `session:~` 或 `session:^$` 表示只显示属于当前会话或不属于任何会话的
#: 标签页。`goto_tab`、`next_tab`、`previous_tab` 等各种标签页导航操作也会
#: 自动限制为只对匹配的标签页生效。

# tab_bar_align left

#: 标签栏的水平对齐方式，可以是 `left`、`center` 或 `right`。

# tab_bar_show_new_tab_button no

#: 设为 `yes` 时，标签栏末尾始终显示一个 `+` 按钮，点击它可以快速打开新
#: 标签页。设为 `no`（默认值）时，该按钮通常处于隐藏状态，但拖动窗口期间
#: 仍会暂时出现，以便将其作为放置目标，在新标签页中打开所拖动的窗口。

# tab_bar_min_tabs 2

#: 显示标签栏所需的最少标签页数量。

# tab_switch_strategy previous

#: 关闭当前标签页后，用于决定切换到哪个标签页的算法。默认值 `previous`
#: 表示切换到上次使用的标签页；`left` 表示切换到被关闭标签页左侧的标签页；
#: `right` 表示切换到其右侧的标签页；`last` 表示切换到最右侧的标签页。

# tab_fade 0.25 0.5 0.75 1

#: 当 `tab_bar_style` 使用 `fade` 时，控制各标签页如何渐隐到背景中。每个
#: 数值都是 0 到 1 之间的 alpha 值，控制对应单元格融入背景的程度：0 表示
#: 不渐隐，1 表示完全渐隐。可以通过增删列表中的数值来改变所使用的单元格
#: 数量。

# tab_separator " ┇"

#: 当 `tab_bar_style` 使用 `separator` 时，标签栏中各标签页之间的分隔符。

# tab_powerline_style angled

#: 当 `tab_bar_style` 使用 `powerline` 时，标签栏中各标签页之间的 Powerline
#: 分隔符样式，可以是 `angled`、`slanted` 或 `round`。

# tab_activity_symbol none

#: 如果标签页中某个未获得焦点的窗口产生活动，在该标签页上显示的文本或
#: Unicode 符号。如果需要保留文本开头或末尾的空格，请用引号将文本括起来。
#: 具体渲染方式参见 `tab_title_template`。

# tab_title_max_length 0

#: 渲染标签页文本最多可使用的单元格数量。设为零表示不作限制。

# tab_title_template "{fmt.fg.red}{bell_symbol}{activity_symbol}{secure_input_symbol}{fmt.fg.tab}{tab.last_focused_progress_percent}{title}"

#: 用于渲染标签页标题的模板。默认只渲染标题以及可选的响铃和活动符号。如果
#: 还想显示标签页索引，可以使用 `{index}:{title}` 之类的格式；为
#: `goto_tab N` 映射了快捷键时，这会很有用。如果希望以上标形式显示索引，
#: 请使用 `{sup.index}`。可用数据如下：

#: title
#:     当前标签页标题。
#: index
#:     可供 `goto_tab N` 快捷键使用的标签页索引。
#: layout_name
#:     当前布局名称。
#: session_name
#:     创建此标签页所用的 kitty 会话文件名称（如果有）。
#: active_session_name
#:     创建此标签页中活动窗口所用的 kitty 会话文件名称（如果有）。
#: num_windows
#:     标签页中的窗口数量。
#: num_window_groups
#:     标签页中的窗口组数量。一个窗口组由一个窗口及其所有覆盖窗口组成。
#: secure_input_symbol
#:     在 macOS 上启用安全输入且此标签页处于活动状态时显示的钥匙符号；
#:     其他情况下为空。
#: tab.active_wd
#:     标签页中当前活动窗口的工作目录（开销较大，需要系统调用）。使用
#:     `tab.active_oldest_wd` 可获取最早前台进程而非最新进程的目录。
#: tab.active_exe
#:     标签页中当前活动窗口前台运行的可执行文件名称（开销较大，需要系统
#:     调用）。使用 `tab.active_oldest_exe` 可获取最早前台进程的可执行文件。
#: max_title_length
#:     可用的最大标题长度。
#: keyboard_mode
#:     当前键盘模式的名称：
#:     <https://sw.kovidgoyal.net/kitty/mapping/#modal-mappings>。
#:     如果没有活动的键盘模式，则为空字符串。
#: tab.last_focused_progress_percent
#:     如果窗口中运行的命令报告任务进度，则以百分比显示标签页内最近获得
#:     焦点的窗口所报告的进度。未报告进度时为空字符串。
#: tab.progress_percent
#:     如果窗口中运行的命令报告任务进度，则以百分比显示标签页内所有窗口
#:     所报告进度的平均值。未报告进度时为空字符串。
#: custom
#:     调用 kitty 配置目录中 `tab_bar.py` 文件内的 `draw_title(data)` 函数。
#:     该函数会收到一个数据字典，其中包含可在此模板中使用的相同数据。函数
#:     可以执行任意复杂的处理并返回字符串。例如，
#:     `tab_title_template "{custom}"` 会将该函数的输出用作标签页标题。
#:     `draw_title()` 中的所有 `print` 语句都会输出到 kitty 进程的标准输出
#:     （STDOUT），便于调试。


#: 请注意，格式化由 Python 的字符串格式化机制完成。例如，可以使用
#: `{layout_name[:2].upper()}`，只显示布局名称的前两个字母并将其转为大写。
#: 如果想设置文本样式，可以使用样式指令，例如：
#: `{fmt.fg.red}red{fmt.fg.tab}normal{fmt.bg._00FF00}greenbg{fmt.bg.tab}`.
#: 粗体和斜体的设置方式类似：
#: `{fmt.bold}bold{fmt.nobold}normal{fmt.italic}italic{fmt.noitalic}`.
#: 256 色终端调色板可以通过 `fmt.fg.color0` 到 `fmt.fg.color255` 使用。请注意，
#: 为保持向后兼容，如果模板中没有 `{bell_symbol}` 或 `{activity_symbol}`，
#: 它们会被自动添加到模板开头。

# active_tab_title_template none

#: 活动标签页使用的模板。未指定时，回退到 `tab_title_template`。

# active_tab_foreground   #000
# active_tab_background   #eee
# active_tab_font_style   bold-italic
# inactive_tab_foreground #444
# inactive_tab_background #999
# inactive_tab_font_style normal

#: 标签栏的颜色和样式。

# tab_bar_background none

#: 标签栏的背景色。默认使用终端背景色。

# tab_bar_margin_color none

#: 标签栏外边距区域的颜色。标签栏上方和下方的外边距默认使用终端背景色。
#: 两侧外边距的默认颜色会与相邻标签页的背景色匹配；但如果窗口为半透明，
#: 则使用默认背景色，因为这样视觉效果更好。

#: }}}

#: 配色方案 {{{

# foreground #dddddd
# background #000000

#: 前景色和背景色。

background_opacity 0.8

#: 终端背景色的不透明度。取值范围为 0 到 1：1 表示不透明，0 表示完全透明。
#: 只有操作系统支持时此设置才会生效，例如在 X11 下使用合成器时。请注意，
#: 它只设置那些背景色与终端默认背景色相同的单元格的不透明度，因此 Vim
#: 状态栏、Powerline 提示符等仍能保持良好效果。但这也意味着，如果编辑器
#: 配色主题自身设置了背景色，该背景不会渲染为透明。此时应修改 kitty 配置
#: 中的默认背景色，并避免在编辑器配色方案中设置背景色；也可以在启动编辑器
#: 的 shell 脚本中使用转义序列设置终端默认颜色。另请参阅
#: `transparent_background_colors`。请注意，使用小于 1.0 的值会降低性能，
#: 影响可能相当明显。此项使用较低值时，最好将背景色设为接近桌面背景整体
#: 颜色的色彩，以获得最佳文本渲染效果。还要注意，此设置不适用于
#: `background_image`。如果需要，背景图像自身可以通过 Alpha 通道包含透明度，
#: kitty 会保留该透明效果。

#: 如果希望动态更改窗口透明度，请将 `dynamic_background_opacity` 设为 `yes`
#: （由于会产生性能开销，默认关闭）。重新加载配置时，只有原配置已经启用了
#: `dynamic_background_opacity`，对此选项的更改才会生效。

# background_blur 0

#: 在支持的平台上，设为正值可启用背景模糊，即模糊透明窗口后方的画面。只有
#: `background_opacity` 小于 1 时才会生效。在 macOS 上，此值还控制模糊
#: 半径（模糊程度）。值过高会造成严重的性能问题和/或渲染瑕疵；通常不超过
#: 64 的值效果良好。根据平台的实现方式，此功能仍可能造成性能问题，请谨慎
#: 使用。目前 macOS 支持此功能；在 Wayland 上，则要求合成器支持背景模糊
#: 扩展。

# transparent_background_colors

#: 最多七种颜色及其不透明度的列表，以空格分隔。当单元格背景色与其中一种
#: 颜色匹配时，会使用指定的不透明度将其渲染为半透明。

#: 这适用于编辑器等较复杂的界面；其中可能需要将多种背景色渲染为透明，例如
#: 光标所在行的高亮背景或高亮区域。终端应用程序可以使用 kitty 颜色控制
#: 转义序列设置这种颜色：
#: <https://sw.kovidgoyal.net/kitty/color-stack/#color-control>。

#: 指定颜色的语法为 `color@opacity`，其中 `@opacity` 部分可省略。省略时，
#: 使用 `background_opacity` 的值。例如：

#:     transparent_background_colors red@0.5 #00ff00@0.3

#: 请注意，还必须将 `background_opacity` 设为小于 1 的值，此设置才能正常
#: 工作。

# dynamic_background_opacity no

#: 允许通过键盘快捷键（`increase_background_opacity` 和
#: `decrease_background_opacity`）或远程控制功能动态更改
#: `background_opacity`。不支持通过重新加载配置来更改此选项。

# background_image none

#: 用于匹配一个或多个背景图像的 glob 模式。图像必须为 PNG、JPEG、WEBP、
#: TIFF、GIF 或 BMP 格式。匹配到的第一张图像用作默认图像。多张图像会按需
#: 存储在 GPU 显存中，因此可以即时切换。若要在背景图像列表中切换，请使用
#: 远程控制命令 `set-background-image`；详情参见
#: `kitten set-background-image --help`。可以将该命令映射到按键，例如：
#: `map f1 remote_control set-background-image +1`。请注意，使用
#: `auto_color_scheme` 时：
#: <https://sw.kovidgoyal.net/kitty/kittens/themes/#auto-color-scheme>
#: 此选项会被配色方案文件覆盖，必须在该文件中设置才能生效。

# background_image_layout tiled

#: 设置背景图像采用平铺、缩放还是限制尺寸。可用值为 `tiled`、
#: `mirror-tiled`、`scaled`、`clamped`、`centered` 或 `cscaled`。`scaled`
#: 和 `cscaled` 都会将图像缩放到窗口大小，其中 `cscaled` 会保持图像宽高比。
#: 请注意，使用 `auto_color_scheme` 时：
#: <https://sw.kovidgoyal.net/kitty/kittens/themes/#auto-color-scheme>
#: 此选项会被配色方案文件覆盖，必须在该文件中设置才能生效。

# background_image_linear no

#: 缩放背景图像时是否使用线性插值。请注意，使用 `auto_color_scheme` 时：
#: <https://sw.kovidgoyal.net/kitty/kittens/themes/#auto-color-scheme>
#: 此选项会被配色方案文件覆盖，必须在该文件中设置才能生效。

# background_tint 0.0

#: 使用背景色为背景图像着色的程度。此选项可以提高文本的可读性。每个窗口都
#: 使用其当前背景色进行着色。只有设置了 `background_image` 时此选项才会
#: 生效。请注意，使用 `auto_color_scheme` 时：
#: <https://sw.kovidgoyal.net/kitty/kittens/themes/#auto-color-scheme>
#: 此选项会被配色方案文件覆盖，必须在该文件中设置才能生效。

# background_tint_gaps 1.0

#: 应用 `background_tint` 后，在窗口间隙处使用背景色为背景图像着色的程度。
#: 此值与 `background_tint` 相乘，因此可以减轻窗口间隙处的着色，产生彼此
#: *分隔* 的视觉效果。请注意，使用 `auto_color_scheme` 时：
#: <https://sw.kovidgoyal.net/kitty/kittens/themes/#auto-color-scheme>
#: 此选项会被配色方案文件覆盖，必须在该文件中设置才能生效。

# dim_opacity 0.4

#: 对设置了 `DIM`/`FAINT` 属性的文本进行暗化的程度。1 表示不暗化，0 表示
#: 完全暗化，即不可见。

# selection_foreground #000000
# selection_background #fffacd

#: 使用鼠标选中文本时的前景色和背景色。将二者都设为 `none` 会对选择区域
#: 产生“反显”效果：选择区域使用单元格的文本颜色，文本则使用单元格的背景色。
#: 如果只将 `selection_foreground` 设为 `none`，前景色将保持不变。请注意，
#: 终端中运行的程序可以覆盖这些颜色。

# palette_generate fixed

#: 如何填充 256 色调色板中未设置（设为 `none`）的颜色。默认情况下，为保持
#: 旧版兼容性，这些颜色会使用传统终端采用的一组固定值。

#: 也可以让 kitty 根据前 16 种颜色生成其余颜色：
#: <https://gist.github.com/jake-stewart/0a8ea46159a7da2c808e5be2177e1783>。

#: 值 `semantic` 表示使用一种能在浅色主题中提供良好可读性的算法，但与固定
#: 颜色编码相比，它会改变某些颜色的语义。值 `legacy` 在浅色主题中的
#: 可读性较差，但与固定颜色编码的偏差更小。

